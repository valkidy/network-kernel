id: 28
name: gingerbread
entity_type: actor
actor_type: agent
camp: enemy_side
collider_template: gingerbread_hit_aabb
health:
  hp: 400
  max_hp: 400
movement:
  controller: character
  # Quicker and lighter than the warrior: this one closes fast and pecks.
  move_speed_meters_per_second: 2.8
  collider_template: gingerbread_movement_capsule
  gravity: {x: 0.0, y: -9.81, z: 0.0}
  max_slope_degrees: 50.0
  step_height: 0.4
  ground_probe_distance: 0.25
  ground_snap_distance: 0.5
  collision_mask: terrain | static_obstacle | actor
hitbox:
  center: {x: 0.0, y: 0.8, z: 0.0}
  half_extents: {x: 0.4, y: 0.8, z: 0.4}
# The plain claw: damage on contact, nothing else.
weapon_slots:
  - 10
active_weapon_slot: 0
animations:
  idle: 0
  chasing: 1
vision:
  collider_template: sentry_grunt_vision_cone
# A melee attacker has to be a chaser: it cannot hurt anything it has not walked
# up to. The distances below are one setting, not three -- see the comment on
# them.
ai:
  controller: chaser
  profile: default
  sentry:
    alert_ticks: 90
    forget_ticks: 150
    patrol_rotation_interval_ticks: 30
    patrol_rotation_min_degrees: 15.0
    patrol_rotation_max_degrees: 30.0
    weapon_id: 10
    animation_idle: idle
    # Despite the name this plays whenever the agent is *moving*, not when it
    # attacks -- the controller sets it from a non-zero move, and the swing
    # itself is driven client-side off the replicated action timeline. Naming
    # an "attack" clip here would play it while walking.
    animation_attack: chasing
  chaser:
    # Holding persists from stop_distance out to resume_distance, so a resume
    # beyond attack_range opens a band where the agent has stopped chasing and
    # cannot yet attack: it parks and does nothing. Keeping resume inside
    # attack_range closes that band, and the catalog rejects the alternative.
    stop_distance_meters: 1.8
    resume_distance_meters: 2.1
    input_magnitude: 1.0
    # Matches grunt_claw_cone's range. Measured origin to origin, while the
    # swing reaches to a target's near edge, so this is conservative: whatever
    # this lets the gingerbread attack, it can actually hit.
    attack_range_meters: 2.2
