id: 20
name: monster_sim_actor
entity_type: actor
actor_type: agent
camp: enemy_side
collider_template: sentry_grunt_hit_aabb
health:
  hp: 500
  max_hp: 500
movement:
  controller: grounded
  move_speed_meters_per_second: 2.5
  collider_template: monster_sim_movement_capsule
  gravity: {x: 0.0, y: -9.81, z: 0.0}
  max_slope_degrees: 50.0
  step_height: 0.4
  ground_probe_distance: 0.25
  ground_snap_distance: 0.5
  max_yaw_degrees_per_second: 45.0
hitbox:
  center: {x: 0.0, y: 8.0, z: 0.0}
  half_extents: {x: 12.0, y: 8.0, z: 11.0}
weapon_slots: [2]
active_weapon_slot: 0
vision:
  collider_template: sentry_grunt_vision_cone
ai:
  controller: sentry
  profile: monster_sim
  sentry:
    alert_ticks: 90
    forget_ticks: 150
    patrol_rotation_interval_ticks: 30
    patrol_rotation_min_degrees: 15.0
    patrol_rotation_max_degrees: 30.0
    passive_patrol: true
    patrol_extent_x_meters: 30.0
    patrol_input_magnitude: 0.6
    weapon_id: 2
    animation_idle: idle
    animation_attack: chasing
animations:
  idle: 0
  chasing: 1
skeleton:
  runtime_asset: skeleton_assets/generated/simplified_monster_sim_v4.ozz
  source_manifest: skeleton_assets/generated/simplified_monster_sim_v4.skeleton_manifest.json
  root_bone: SIM_Root
  body_bone: JNT_BodyRoot
locomotion:
  type: procedural_legged
  forward_axis: positive_z
  input_deadzone: 0.01
  gait:
    type: displacement_threshold
    step_threshold_meters: 5.5
    step_duration_ticks: 6
    max_swinging_legs: 2
    processing_order: [front_left, front_right, rear_left, rear_right]
  foothold:
    query: raycast
    # Covers the observed 0.99 m rise and 16.68 m drop around the nominal feet.
    query_start_height_meters: 2.0
    query_distance_meters: 20.0
    candidate_offsets_meters:
      - {x: 0.0, z: 0.0}
      - {x: 0.2, z: 0.0}
      - {x: -0.2, z: 0.0}
      - {x: 0.0, z: 0.2}
      - {x: 0.0, z: -0.2}
  legs:
    - id: front_left
      hip_bone: JNT_LegFrontLeft_Hip
      knee_bone: JNT_LegFrontLeft_Knee
      foot_bone: JNT_LegFrontLeft_Foot
      gait_group: 0
      pole_local: {x: 0.0, y: 0.0, z: 1.0}
      step_height_meters: 4.0
      max_reach_ratio: 0.99
    - id: rear_right
      hip_bone: JNT_LegRearRight_Hip
      knee_bone: JNT_LegRearRight_Knee
      foot_bone: JNT_LegRearRight_Foot
      gait_group: 0
      pole_local: {x: 0.0, y: 0.0, z: -1.0}
      step_height_meters: 4.0
      max_reach_ratio: 0.99
    - id: front_right
      hip_bone: JNT_LegFrontRight_Hip
      knee_bone: JNT_LegFrontRight_Knee
      foot_bone: JNT_LegFrontRight_Foot
      gait_group: 1
      pole_local: {x: 0.0, y: 0.0, z: 1.0}
      step_height_meters: 4.0
      max_reach_ratio: 0.99
    - id: rear_left
      hip_bone: JNT_LegRearLeft_Hip
      knee_bone: JNT_LegRearLeft_Knee
      foot_bone: JNT_LegRearLeft_Foot
      gait_group: 1
      pole_local: {x: 0.0, y: 0.0, z: -1.0}
      step_height_meters: 4.0
      max_reach_ratio: 0.99
