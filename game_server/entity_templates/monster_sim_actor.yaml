id: 20
name: monster_sim_actor
entity_type: actor
actor_type: agent
camp: enemy_side
collider_template: sentry_grunt_hit_aabb
health:
  hp: 500
  max_hp: 500
movement:
  controller: character
  move_speed_meters_per_second: 2.5
  collider_template: monster_sim_movement_capsule
  gravity: {x: 0.0, y: -9.81, z: 0.0}
  max_slope_degrees: 50.0
  step_height: 0.4
  ground_probe_distance: 0.25
  ground_snap_distance: 0.5
  max_yaw_degrees_per_second: 45.0
  # The world, but not other actors. This actor carries its body on a capsule
  # whose bottom is 4 m up and whose span is 32 m across; everything between the
  # legs is open air that a walker steps over, not geometry it should walk into.
  # Leaving the default (terrain | static_obstacle | actor) makes a player
  # standing under the belly a wall, because the capsule is what is asked, not
  # the legs.
  #
  # static_obstacle is what props register on, so keeping it means the monster
  # still stops at ice blocks, terminals and the rest of the placed world -- only
  # actor-vs-actor blocking is given up.
  #
  # The mask is symmetric: dropping "actor" also takes this capsule out of every
  # other actor's movement sweep, so a player does not walk into the belly the
  # monster itself ignores. Same authoring shape as a projectile's
  # collision_mask, different vocabulary -- these are movement layers
  # (terrain | static_obstacle | actor), not gameplay sides.
  collision_mask: terrain | static_obstacle
hitbox:
  center: {x: 0.0, y: 8.0, z: 0.0}
  half_extents: {x: 12.0, y: 8.0, z: 11.0}
weapon_slots: [2]
active_weapon_slot: 0
vision:
  collider_template: sentry_grunt_vision_cone
ai:
  controller: sentry
  profile: monster_sim
  sentry:
    alert_ticks: 90
    forget_ticks: 150
    patrol_rotation_interval_ticks: 30
    patrol_rotation_min_degrees: 15.0
    patrol_rotation_max_degrees: 30.0
    passive_patrol: true
    patrol_extent_x_meters: 30.0
    patrol_input_magnitude: 1.0
    weapon_id: 2
    animation_idle: idle
    animation_attack: chasing
animations:
  idle: 0
  chasing: 1
skeleton:
  runtime_asset: skeleton_assets/generated/simplified_monster_sim_v4.ozz
  source_manifest: skeleton_assets/generated/simplified_monster_sim_v4.skeleton_manifest.json
locomotion:
  type: procedural_legged
  input_deadzone: 0.01
  gait:
    type: displacement_threshold
    # Sized to move_speed, NOT to the rig. LocomotionTest scales its gait off
    # leg length alone (stepThreshold = legLength * 0.30, stepHeight * 0.22)
    # because it also scales moveSpeed the same way (LeggedLocomotion.cs:108,
    # 109, 163: moveSpeed * legLength). We keep gameplay speed at 2.5 m/s while
    # the rig measures 18.24 m per leg, so copying the rig-derived 5.47 m
    # threshold gave a 2.2 s stance against a 0.2 s swing -- an 8% swing duty
    # factor where the prototype runs 42%, with the foot travelling 11x the
    # body's speed instead of 1.4x. That is the "stand still, then flick a leg
    # 5.5 m" look, and it is a gait-tuning artefact, not a netcode one.
    #
    # The invariant worth porting is the prototype's timing, which is leg-length
    # independent by construction: stance = stepThreshold / moveSpeed =
    # 0.30L / 1.2L = 0.25 s. At 2.5 m/s that is 0.625 m, and step_height keeps
    # the prototype's height/stride ratio (0.22 / 0.30 = 0.73).
    #
    # Those timings are then scaled up together by 3x, because a stride sized
    # purely by the clock reads as mincing on a rig with 18 m legs. Threshold
    # and duration MUST move together: raising the threshold alone makes the
    # foot cover three times the ground in the same 0.2 s swing, and the peak
    # foot speed measured over a 30 s walk goes 3.7x the body's -> 10.0x at
    # 1.95/6 and 13.0x at 2.60/6, which is the leg-flick this tuning existed to
    # remove. Scaling both leaves it at 3.8x and the duty factor at 46%:
    #
    #   threshold | duration | stride  | duty | peak foot speed / body speed
    #      0.65   |     6    | 1.17 m  | 41%  |  3.7x
    #      1.95   |     6    | 2.50 m  | 21%  | 10.0x
    #      2.60   |     6    | 3.17 m  | 15%  | 13.0x
    #      1.95   |    18    | 3.50 m  | 46%  |  3.8x   <- authored
    #      2.60   |    24    | 4.67 m  | 46%  |  3.8x
    #
    # Stride runs about 1.8x the threshold: a step triggers once drift exceeds
    # it, and the landing target is then aimed ahead by the body's travel over
    # the swing. The last row is the 4x variant if this still reads short.
    #
    # The 0.25/3 diagnostic that shrank the whole drift budget inside the reach
    # is reverted here. It never actually ran: the Unity package tracks
    # network-kernel@dev-latest, which was still on 1.95/18, so the [LegReach]
    # session that was read as "the diagnostic changed nothing" was in fact
    # another 1.95/18 run. What rules the gait out is the model below plus
    # capture/locomotion_tests, whose authoritative 1.95/18 run reproduces that
    # session's numbers exactly. Stride was never what spent the reach.
    #
    # What spends it is terrain relief. The rig's bind pose is a straight strut
    # -- hips 13.76 m up and 12.5 m out over the feet, on 17.9-18.7 m of bone --
    # so a leg rests at 98-99.5% of its own length and a foothold may sit only
    # 0.10-0.47 m BELOW the plane the body stands on before the IK clamps:
    #
    #   leg          bones   rest%   max dip   max drift
    #   FrontLeft    18.66   99.5%     0.10 m     0.11 m
    #   FrontRight   18.47   98.8%     0.27 m     0.31 m
    #   RearLeft     17.92   98.0%     0.47 m     0.52 m
    #   RearRight    17.92   97.9%     0.47 m     0.52 m
    #
    # undulating.obj varies by 1.47 m (median) to 2.61 m across this rig's
    # 16.1 m stance, which is 3x to 26x the dip budget. Sampling 2500 random
    # positions and headings on that terrain, the share of poses with at least
    # one clamped leg (and the mean number clamped, of 4):
    #
    #   body seated | threshold 1.95 | threshold 0 (standing still)
    #      bind     |   84%  1.89    |   83%  1.87
    #      -2 m     |   48%  0.85    |   44%  0.76
    #      -4 m     |   20%  0.30    |   18%  0.28
    #      -5 m     |   10%  0.15    |   10%  0.14
    #
    # The two columns are the same to within noise: the gait contributes almost
    # nothing, and only the seat height moves the number. (The model is
    # pessimistic in absolute terms -- it ignores the 5-candidate foothold fan
    # and the reachable-landing fallback, both of which recover some clamps --
    # so read the columns against each other, not as absolute rates. The
    # measured rate is in capture/locomotion_tests.) So the fix buys reach
    # rather than shortening the stride, through body.stance_crouch_meters
    # below, which bends the knees for ~2.8-3.1 m of slack.
    #
    # Measured on the "+X" capture, 300 samples, before and after seating the
    # body on its own feet at a 4 m crouch:
    #
    #                                  before     after
    #   worst leg clamped               40.7%      2.3%
    #   leg extension, p10-p90        83-100%    78-91%
    #   foot above the ground, median  +0.22 m   +0.00 m
    #                          p90     +2.08 m   +0.35 m
    #   leg-samples over 1 m off           34%        3%
    #   travel in 10 s                 23.95 m   23.96 m
    #
    # What remains is a single leg on the steepest ground. Closing that needs
    # either a deeper crouch, a stance-width parameter (0.8x stance modelled at
    # 8%, but no such parameter exists yet), or a rig whose bind pose leaves the
    # knees bent.
    #
    # Numbers above are reproduced by
    #   bazel run //engine/src/tests/kernel_tests:locomotion_reach_report -- \
    #     $PWD/bazel-bin/game_server/skeleton_assets/generated/\
    # simplified_monster_sim_v4.ozz
    #
    # Turning is the other driver of stance drift and it dominates here: at
    # max_yaw 45 deg/s across a 16.08 m stance radius the stance sweeps at
    # 12.6 m/s, five times the walk, which no threshold in this range can keep
    # up with. Measured worst stance error over a 20 s run, flat ground:
    #
    #   threshold | walk duty | walk err | patrol err | sustained-spin err
    #      5.50   |     7%    |  5.92 m  |   8.26 m   |      7.94 m
    #      2.00   |    20%    |  2.42 m  |  10.29 m   |     32.26 m
    #      1.20   |    32%    |  1.67 m  |  10.65 m   |     32.26 m
    #      0.65   |    41%    |  1.08 m  |  10.19 m   |     32.26 m
    #
    # "patrol" slews the heading 30 deg once a second the way the sentry AI
    # does; its error is set by the 45 deg/s slew, not by the threshold, so
    # shrinking the stride costs ~2 m of turn lag to gain 6x the walk duty.
    # "spin" holds max yaw rate indefinitely and saturates at 32.26 m, which is
    # twice the stance radius -- feet diametrically opposite their home, fully
    # decoupled. Sustained spinning is not what the sentry does, but if it ever
    # matters the knob is max_yaw_degrees_per_second: the legs keep up to about
    # 8-10 deg/s at this threshold (measured 1.05 m error at 8 deg/s, saturated
    # by 12 deg/s), which is far slower than gameplay currently wants.
    step_threshold_meters: 1.95
    step_duration_ticks: 18
    max_swinging_legs: 2
    processing_order: [front_left, front_right, rear_left, rear_right]
  foothold:
    query: raycast
    # Ray coverage is scaled to the rig (legs ~18 m): the start height must clear
    # any terrain that rises ahead of a foot's home stance, and the distance must
    # reach any drop below it. LocomotionTest uses rayUp = legLength*3 and
    # rayLength = legLength*30; these are the same order of magnitude, trimmed to
    # the undulating terrain's amplitude. Too small a start height makes a foot's
    # home ray start below rising terrain and miss, stalling that leg's steps.
    query_start_height_meters: 30.0
    query_distance_meters: 90.0
    candidate_offsets_meters:
      - {x: 0.0, z: 0.0}
      - {x: 0.2, z: 0.0}
      - {x: -0.2, z: 0.0}
      - {x: 0.0, z: 0.2}
      - {x: 0.0, z: -0.2}
  # follow_speed > 0 hands body height to the legs: the body rides the average
  # of its own footholds instead of the terrain the movement capsule happens to
  # be standing on. 10 is LocomotionTest parity (LeggedLocomotion.cs authors
  # bodyFollowSpeed = 10 under the same k = 1 - exp(-speed * dt) smoothing).
  #
  # This used to be held at 0 because the two writers fought: the character step
  # resolved height, locomotion blended away from it, and the next tick resolved
  # it again -- measured as a 23.1 m / 10 s patrol against a 23.75-25.5 m band.
  # They no longer fight, because locomotion now smooths from the height it
  # itself last applied rather than from the transform, so the controller's
  # answer is not readmitted every tick. It still owns x/z, and owns y whenever
  # no foot is planted.
  #
  # Why it matters here rather than as polish: the capsule is 3 m in radius and
  # the stance is 32 m across, so the height it resolves and the height the feet
  # imply differ by 0.22 m (median) to 0.76 m (p90), plus a further 0.49 m of
  # standing bias because a capsule that wide bridges this terrain's dips
  # instead of following them. All of it lands in the knees: measured live, leg
  # extension pumped between 75% and 95% every second on a rig whose rest is
  # 85%. Riding the feet removes the mismatch by construction.
  #
  # slope_alignment stays 0. Tilt changes applied_root_rotation, which is where
  # the feet are placed, and a follower holds an identity tilt because it never
  # samples ground normals -- enabling it on the authority alone desynchronises
  # replicated legs. Height has no such problem: it arrives inside the
  # replicated transform.
  #
  # stance_crouch_meters is the knee-bend knob, and it replaces the earlier
  # trick of offsetting the movement capsule to sink the whole rig. 4.0 m takes
  # each leg from 0.07-0.35 m of reach slack to 2.8-3.1 m; see
  # //engine/src/tests/kernel_tests:locomotion_reach_report for the table. The
  # movement capsule is unaffected: it rides the controller's own vertical
  # anchor, not the crouched body.
  body:
    follow_speed: 10.0
    slope_alignment: 0.0
    stance_crouch_meters: 4.0
  # One value for every leg on all four rigs, so it is a default rather than
  # something repeated per leg.
  leg_defaults:
    step_height_meters: 0.18
    max_reach_ratio: 0.999
  # Only the gait grouping differs per leg; the bones and bend geometry are in
  # the rig file.
  legs:
    - id: front_left
      gait_group: 0
    - id: rear_right
      gait_group: 0
    - id: front_right
      gait_group: 1
    - id: rear_left
      gait_group: 1
