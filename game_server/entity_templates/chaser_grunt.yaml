id: 26
name: chaser_grunt
entity_type: actor
actor_type: agent
camp: enemy_side
collider_template: sentry_grunt_hit_aabb
health:
  hp: 500
  max_hp: 500
movement:
  controller: character
  move_speed_meters_per_second: 2.5
  collider_template: sentry_grunt_movement_capsule
  gravity: {x: 0.0, y: -9.81, z: 0.0}
  max_slope_degrees: 50.0
  step_height: 0.4
  ground_probe_distance: 0.25
  ground_snap_distance: 0.5
  collision_mask: terrain | static_obstacle | actor
hitbox:
  center: {x: 0.0, y: 0.8, z: 0.0}
  half_extents: {x: 0.4, y: 0.8, z: 0.4}
weapon_slots:
  - 10
active_weapon_slot: 0
animations:
  idle: 0
  chasing: 1
vision:
  collider_template: sentry_grunt_vision_cone
# Detection and firing match sentry_grunt; the difference is that this one
# closes on what it sees, and gives up the moment the target leaves its cone.
#
# It closes because it has to: the claw is a two-metre cone, so an attack from
# anywhere else in the vision cone would swing through empty air. That is what
# chaser.attack_range_meters below is for -- visibility alone would have it
# swinging from across the room.
ai:
  controller: chaser
  profile: default
  sentry:
    alert_ticks: 90
    forget_ticks: 150
    patrol_rotation_interval_ticks: 30
    patrol_rotation_min_degrees: 15.0
    patrol_rotation_max_degrees: 30.0
    weapon_id: 10
    animation_idle: idle
    animation_attack: chasing
  chaser:
    # These three are one setting, not three. Holding persists from
    # stop_distance all the way out to resume_distance, so a resume_distance
    # beyond attack_range opens a band where the grunt has stopped chasing and
    # cannot yet attack -- it stands still and does nothing until the target
    # walks far enough away to restart the chase. Keeping resume inside
    # attack_range closes that band: everywhere the grunt is parked, it swings.
    stop_distance_meters: 1.8
    resume_distance_meters: 2.1
    input_magnitude: 1.0
    # Matches the claw's cone range. Measured origin to origin, while the swing
    # reaches to a target's near edge, so this sits on the conservative side of
    # the weapon: everything this lets the grunt attack, it can actually hit.
    attack_range_meters: 2.2
