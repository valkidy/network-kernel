# Agent-only. Nothing puts weapon 8 in a player loadout; it exists so
# beam_sentry.yaml has something to point weapon_slots at.
id: 8
name: Sentry Beam Emitter
weapon_type: beam
# 45 ticks = 1.5 s of continuous beam per magazine at 30 Hz, since the fire
# action spends one round per tick.
magazine_size: 45
# The sentry has no ammo economy and no way to scavenge; running it dry would
# just park it in a permanent reload. Same choice as spammer.yaml.
reserve_magazines: 65535
fire_action_template: beam_sentry_fire
projectile_template: beam_sentry_beam
