# What this rig IS, as opposed to how any particular actor walks it. Paired with
# simplified_monster_sim_v4.ozz and simplified_monster_sim_v4.skeleton_manifest.json by name.
#
# Bone identity, the limb's bend geometry, and which bones carry colliders. What
# is NOT here is anything that changes when the same skeleton is put to a
# different use: gait timing (tuned against move_speed, which is combat data),
# gait grouping (the same rig can walk, trot or pace), step height, reach ratio,
# crouch and body follow all stay on the entity template.
rig_version: 2
skeleton: simplified_monster_sim_v4
forward_axis: positive_z
root_bone: SIM_Root
body_bone: JNT_BodyRoot
# One value for the whole rig: mid_axis is read in the knee's OWN frame, and
# these legs are copies of a single limb with re-aimed hips. pole_local below is
# model-space and therefore genuinely per leg -- it does not rotate with the hip.
knee_hinge_local: {x: 0.0, y: 0.0, z: 1.0}
legs:
  - {id: front_left, hip: JNT_LegFrontLeft_Hip, knee: JNT_LegFrontLeft_Knee, foot: JNT_LegFrontLeft_Foot,
     pole_local: {x: 0.0, y: 0.0, z: 1.0}}
  - {id: rear_right, hip: JNT_LegRearRight_Hip, knee: JNT_LegRearRight_Knee, foot: JNT_LegRearRight_Foot,
     pole_local: {x: 0.0, y: 0.0, z: -1.0}}
  - {id: front_right, hip: JNT_LegFrontRight_Hip, knee: JNT_LegFrontRight_Knee, foot: JNT_LegFrontRight_Foot,
     pole_local: {x: 0.0, y: 0.0, z: 1.0}}
  - {id: rear_left, hip: JNT_LegRearLeft_Hip, knee: JNT_LegRearLeft_Knee, foot: JNT_LegRearLeft_Foot,
     pole_local: {x: 0.0, y: 0.0, z: -1.0}}
