id: 14
name: monster_sim_movement_capsule
shape: capsule
# center.y - (half_height + radius) = 0, i.e. the capsule bottom is the entity
# origin, which is the ordinary convention here.
#
# It stays that way even though this actor's body is seated well below its own
# footholds (locomotion.body.stance_crouch_meters). The capsule does not follow
# the body down: while body follow is on, the character controller keeps its own
# vertical anchor (MovementState::controller_height) and this offset is measured
# against that, not against transform.position.y. Offsetting the capsule to
# chase the crouch was tried and cannot work -- the gap between the two heights
# is set by the terrain under the stance, so no fixed offset keeps the capsule
# on the ground. Burying it collapsed a 10 s patrol from ~24 m to 2.4 m.
center: {x: 0.0, y: 8.0, z: 0.0}
half_height: 5.0
radius: 3.0
purpose: movement
layer: hostile_side
