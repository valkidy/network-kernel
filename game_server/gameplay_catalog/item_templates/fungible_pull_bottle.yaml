# Gathering grenade: pulls everything hostile in range toward the blast and
# staggers it. The inverse of fungible_shockwave_bottle, and the setup for a
# frag -- and only hostile_side, so it is safe to throw near your team.
#
# Fungible and identity-preserving, like fungible_shockwave_bottle: a throw
# splits one bottle off the stack and the prop that lands is that bottle.
id: 3010
name: fungible_pull_bottle
mode: fungible
max_stack: 3
capabilities: [pickupable, throwable]
entity_template: pull_bottle_prop
world_interaction:
  range: 3.0
  line_of_sight_required: false
throw:
  mode: identity_preserving
  trajectory_projectile: grenade_shell_projectile
use:
  quantity_cost: 0
  cooldown_ticks: 0
  destroy_when_empty: false
