# Chain lightning in a bottle: where it breaks, lightning arcs to the nearest
# four hostile actors within 8 m, five times over a second and a third.
#
# Fungible and identity-preserving, like fungible_tornado_bottle: a throw
# splits one bottle off the stack and the prop that lands is that bottle.
id: 3033
name: fungible_chain_lightning_bottle
mode: fungible
max_stack: 3
capabilities: [pickupable, throwable]
entity_template: chain_lightning_bottle
world_interaction:
  range: 3.0
  line_of_sight_required: false
throw:
  mode: identity_preserving
  trajectory_projectile: grenade_shell
use:
  quantity_cost: 0
  cooldown_ticks: 0
  destroy_when_empty: false
