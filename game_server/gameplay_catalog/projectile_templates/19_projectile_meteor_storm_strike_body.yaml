# One storm meteor. Spawned on its landing point, it starts 40 m above it,
# from a seeded direction at 75-85 degrees, and lands in 57 ticks. It hits only
# the static world: the blast is what hurts, so a meteor whose path crosses an
# actor still lands where it was aimed.
id: 19
name: meteor_storm_strike_body
type: standard
collider_template: projectile_sphere
damage: 0
damage_shape: none
collision_mask: terrain | static_obstacle
lifetime_ticks: 60
launch:
  type: descent
  elevation_degrees: [75, 85]
  height: 40.0
  fall_ticks: 57
triggers:
  on_projectile_impact:
    action_graph: action_spawn_projectile
    parameters:
      template: meteor_storm_strike_blast
      position: event.position
      direction: event.direction
  on_expired:
    action_graph: action_spawn_projectile
    parameters:
      template: meteor_storm_strike_blast
      position: event.position
      direction: event.direction
# Never sent: clients derive it from the marker at the root of its chain.
replication: derived
