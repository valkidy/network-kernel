# One evaluation at the moment of impact, falling off linearly to the edge of a
# 1.25 m sphere. Friend and foe, the caster included. The damage is the
# projectile's, with its falloff; the graph paralyses 25% of the actors it
# reaches, each rolled on its own.
id: 49
name: call_lightning_strike_blast
type: area_effect
collider_template: call_lightning_strike_blast_sphere
damage: 500
lifetime_ticks: 2
damage_behavior:
  type: area_interval
  damage_interval_ticks: 2
  falloff: linear
collision_mask: damageable
hit_instigator: true
triggers:
  on_projectile_impact:
    action_graph: action_apply_status_if_target
    parameters:
      target: event.target
      status: paralysis
      direction: event.direction
      possibility: 25
# Never sent: clients derive it from the marker at the root of its chain.
replication: derived
