# One evaluation at the moment of impact (interval >= lifetime), falling off
# linearly to the edge of an 8 m sphere. Friend and foe, the caster included.
id: 43
name: ice_spike_strike_blast
type: area_effect
collider_template: ice_spike_strike_blast_sphere
damage: 60
lifetime_ticks: 2
damage_behavior:
  type: area_interval
  damage_interval_ticks: 2
  falloff: linear
collision_mask: damageable
hit_instigator: true
# Never sent: clients derive it from the marker at the root of its chain.
replication: derived
