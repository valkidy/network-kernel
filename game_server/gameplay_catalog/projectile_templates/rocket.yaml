id: 3
name: rocket_projectile
damage: 45
# Linear, zero gravity, constant speed: the path is a closed-form function of
# spawn position and initial velocity, so there is nothing here a client
# cannot reproduce. Held at server_snapshot_only it had no local prediction
# at all (kernel.cc: a ServerSnapshotOnly template never becomes a
# PredictedProjectile), which left it drawn purely from the budgeted
# snapshot rotation -- weight 1 against an actor's 8 -- and a crowd of
# agents starved it down to the kMaxSnapshotsWithoutSend floor. Hybrid is
# what NETCODE_SYNC_POLICY.md already calls this weapon: predict the flight
# locally, keep the snapshot as the authoritative correction.
sync_mode: hybrid_deterministic_then_snapshot
collider_template: rocket_aabb
movement_model: linear
hit_response: destroy
damage_shape: direct_hit
speed: 35.0
lifetime_ticks: 75
# limb makes a legged rig's bones a target, so a rocket aimed at a monster
# strikes the leg in its path instead of sailing between them into the body.
# The hit resolves to the actor wearing the leg, so damage and side filtering
# are unchanged.
collision_mask: damageable | limb | terrain | static_obstacle
max_hit_count: 1
gravity:
  x: 0.0
  y: 0.0
  z: 0.0
triggers:
  on_projectile_impact:
    action_graph: action_spawn_projectile_at_impact
    parameters:
      template: rocket_explosion
      position: event.position
      direction: event.direction
