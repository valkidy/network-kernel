id: 8
name: rocket_explosion
kind: area_effect
collider_template: area_effect_sphere
# Read as damage per interval, dealt every damage_interval_ticks.
damage: 45
lifetime_ticks: 45
damage_behavior:
  type: area_interval
  damage_interval_ticks: 45
  falloff: linear
collision_mask: damageable | prop
triggers:
  on_projectile_impact:
    action_graph: action_rocket_explosion_at_target
    parameters:
      target: event.target
      amount: 45
      # No `strength` here on purpose. A binding override is always read as the
      # scalar form, so passing one would silently defeat the graph's
      # [horizontal, vertical] default and put the knockback back to what it
      # was before it worked.
      direction: event.direction
