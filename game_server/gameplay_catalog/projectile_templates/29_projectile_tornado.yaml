# A tornado: a funnel that rides the ground and, every 15 ticks (0.5 s), pulls
# in everything hostile its column reaches. It deals no damage and staggers
# nobody.
#
# One entity for its whole life -- the periodic pull is the field's own
# overlap every damage_interval_ticks, not a child spawned per pull.
#
# It climbs and descends slopes up to 50 degrees at a 2 m hover, holds its
# height off a cliff, and stops against anything steeper; terrain is the only
# thing that stops it. Locally predicted: each client steps it with the same
# solver over the same terrain, and nothing about it is sent after the spawn.
# The pull itself is the server's alone.
#
id: 29
name: tornado
type: area_effect
collider_template: tornado_column
damage: 0
speed: 6.0
lifetime_ticks: 300
sync_mode: local_predicted_deterministic
damage_behavior:
  type: area_interval
  damage_interval_ticks: 15
  falloff: none
collision_mask: hostile_side
motion_collision_mask: terrain
# Its reach, a column standing on the ground, is the collider's
# (39_collider_tornado_column.yaml).
motion:
  type: ground_follow
  hover_height: 2.0
triggers:
  on_projectile_impact:
    action_graph: action_apply_pull
    parameters:
      target: event.target
      # The funnel's centre when it pulled, the one point every target of one
      # pull shares.
      anchor: event.subject_position
      # Land 1 m from where the centre was, each on its own side.
      distance: 1.0
      # 0.6 s in the air, longer than the 15-tick interval: a target still
      # flying from one pull can be caught by the next and pulled again. That
      # is intended -- the funnel keeps hold of what it has gathered.
      airtime: 18
      # The far edge of the 6 m column needs (6 - 1) / 0.6 = 8.3 m/s.
      max_speed: 12.0
      # Who is moved, not how fast: pulled only past its force_resistance.
      strength: 20.0
