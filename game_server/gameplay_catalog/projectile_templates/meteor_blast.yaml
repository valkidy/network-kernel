# One evaluation at the moment of impact (interval >= lifetime), falling off
# linearly to the edge of a 4 m sphere. Plain area damage, no graph: a bound
# graph would replace the falloff with a flat amount.
id: 20
name: meteor_blast
kind: area_effect
collider_template: meteor_blast_sphere
damage: 60
lifetime_ticks: 2
damage_behavior:
  type: area_interval
  damage_interval_ticks: 2
  falloff: linear
collision_mask: hostile_side
