# The Water Bubble Staff's bolt: a straight, fast shot that does no damage of
# its own and puts the one actor it strikes in a bubble (status water_bubble).
# Linear and gravity-free like the rocket, so a client can predict its whole
# flight (hybrid); damage_shape none, since the status is the whole effect.
id: 30
name: water_bubble_bolt
damage: 0
sync_mode: hybrid_deterministic_then_snapshot
collider_template: rocket_aabb
movement_model: linear
hit_response: destroy
damage_shape: none
speed: 30.0
lifetime_ticks: 45
# limb as the rocket has it: a bolt aimed at a legged rig strikes the leg in
# its path, and the hit resolves to the actor wearing it.
collision_mask: damageable | limb | terrain | static_obstacle
max_hit_count: 1
gravity:
  x: 0.0
  y: 0.0
  z: 0.0
triggers:
  on_projectile_impact:
    action_graph: action_apply_status_at_impact
    parameters:
      target: event.target
      status: water_bubble
      direction: event.direction
