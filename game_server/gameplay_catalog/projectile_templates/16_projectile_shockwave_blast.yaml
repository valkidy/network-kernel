# The control grenade: wide, weak, and it always shoves and staggers.
#
# hostile_side only, so it can be thrown at your own feet or into a melee your
# team is in: players and props are never pushed. It does not break props.
#
# One hit per blast -- lifetime equals the interval, as in rocket_explosion.
# Low damage on purpose: the shockwave softens and displaces, it does not kill.
id: 16
name: shockwave_blast
type: area_effect
collider_template: shockwave_area_sphere
damage: 20
# Authored, not derived: 20 damage would never stagger on its own. 150 is the
# highest threshold in the catalog, so this staggers every actor.
stagger: 150
lifetime_ticks: 30
damage_behavior:
  type: area_interval
  damage_interval_ticks: 30
  falloff: none
collision_mask: hostile_side
triggers:
  on_projectile_impact:
    action_graph: action_apply_impulse
    parameters:
      target: event.target
      direction: event.direction
      # Split for the rocket's reason, stronger because shoving is this
      # grenade's whole job.
      strength: [14.0, 6.0]
      # ~1.2 s of airtime (~37 ticks); a ceiling, released on landing.
      lockout: 60
