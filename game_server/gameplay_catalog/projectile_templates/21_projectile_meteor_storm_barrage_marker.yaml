# Meteor Storm's centre mark. After 30 ticks it expires into the storm:
# action_spawn_projectile_repeated scatters the strike fuses around it.
id: 21
name: meteor_storm_barrage_marker
type: standard
damage: 0
damage_shape: none
speed: 0.0
collision_mask: none
sync_mode: server_snapshot_only
lifetime_ticks: 30
triggers:
  on_expired:
    action_graph: action_spawn_projectile_repeated
    parameters:
      template: meteor_storm_strike_fuse
      position: event.position
      direction: event.direction
      # 10-15 fuses within 25 m, each living 10 ticks plus a share of a
      # 60-tick window, so they expire one after another.
      lifetime: 10
      count: [10, 15]
      scatter_radius: 25.0
      lifetime_spread: 60
