# The kill grenade: medium radius, heavy damage, no shove and no stagger.
#
# It hits every side, the thrower included: 1000 is a full player health bar, so
# a frag at your own feet is a death.
#
# hit_instigator is not what makes that true today. An area effect skips its
# shooter unless this is set, but this blast has no shooter: the bottle's
# on_collision trigger is dispatched with instigator 0, so nobody is skipped.
# It is kept so the frag still hits its thrower if that provenance ever starts
# naming the thrower.
#
# It goes through a graph rather than the plain damage path so that it can say
# stagger: 0. Plain area damage derives stagger from the amount (per_damage 1.0),
# which at 1000 is over every actor's threshold. The price is falloff: a bound
# area effect deals the graph's flat amount, so `damage` below is only a label.
id: 17
name: frag_blast
kind: area_effect
collider_template: frag_area_sphere
damage: 1000
lifetime_ticks: 30
damage_behavior:
  type: area_interval
  damage_interval_ticks: 30
  falloff: none
collision_mask: damageable | prop
hit_instigator: true
triggers:
  on_projectile_impact:
    action_graph: action_frag_at_target
    parameters:
      target: event.target
