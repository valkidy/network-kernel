# A tent folding away throws the people around it clear (D12): however it
# goes -- shot down, run out, evicted by a newer one -- its occupants are let
# out first and then this goes off where it stood.
#
# player_side only: it is the occupants it is for. One hit per blast, as in
# shockwave_blast: the lifetime equals the interval. A shove, not an attack:
# no damage, no stagger.
id: 27
name: tent_collapse_blast
type: area_effect
collider_template: tent_collapse_sphere
damage: 0
lifetime_ticks: 30
damage_behavior:
  type: area_interval
  damage_interval_ticks: 30
  falloff: none
collision_mask: player_side
triggers:
  on_projectile_impact:
    action_graph: action_apply_impulse
    parameters:
      target: event.target
      direction: event.direction
      # Split for the rocket's reason: the blast's radial is level.
      strength: [8.0, 5.0]
      # ~1 s up and down; landing releases it sooner.
      lockout: 45
