# One evaluation at the moment of impact (interval >= lifetime), falling off
# linearly to the edge of a 4 m sphere. Friend and foe, the caster included.
# Plain area damage: the projectile's own damage keeps its falloff.
id: 20
name: meteor_storm_strike_blast
type: area_effect
collider_template: meteor_storm_strike_blast_sphere
damage: 800
lifetime_ticks: 2
damage_behavior:
  type: area_interval
  damage_interval_ticks: 2
  falloff: linear
collision_mask: damageable
hit_instigator: true
# Never sent: clients derive it from the marker at the root of its chain.
replication: derived
