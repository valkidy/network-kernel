id: 30
name: gingerbread-infantry
entity_type: actor
actor_type: agent
camp: enemy_side
collider_template: gingerbread_hit_aabb
health:
  hp: 700
  max_hp: 700
movement:
  controller: character
  # Slower than the plain gingerbread. The heavy hit is worth walking into.
  move_speed_meters_per_second: 3.2
  collider_template: gingerbread_movement_capsule
  gravity: {x: 0.0, y: -9.81, z: 0.0}
  max_slope_degrees: 50.0
  step_height: 0.4
  ground_probe_distance: 0.25
  ground_snap_distance: 0.5
  collision_mask: terrain | static_obstacle | actor
hitbox:
  center: {x: 0.0, y: 0.8, z: 0.0}
  half_extents: {x: 0.4, y: 0.8, z: 0.4}
# The slam: its shot template names an impact graph, so the hit arrives as
# damage plus knockback rather than damage alone.
weapon_slots:
  - 11
active_weapon_slot: 0
animations:
  idle: 0
  chasing: 1
vision:
  collider_template: sentry_grunt_vision_cone
ai:
  controller: chaser
  profile: default
  sentry:
    alert_ticks: 90
    forget_ticks: 150
    patrol_rotation_interval_ticks: 30
    patrol_rotation_min_degrees: 15.0
    patrol_rotation_max_degrees: 30.0
    weapon_id: 11
    animation_idle: idle
    # See gingerbread.yaml: this is the locomotion clip, not the swing.
    animation_attack: chasing
  chaser:
    stop_distance_meters: 1.8
    resume_distance_meters: 2.1
    input_magnitude: 1.0
    # Matches grunt_slam_cone's range, which currently equals the claw's. If
    # you widen or shorten the slam's cone, this has to move with it.
    attack_range_meters: 2.2
  # Only read when this one is in a squad; a lone chaser has no slot.
  #
  # input_magnitude is a fraction of this template's own move speed, and the
  # squad's cursor advances at a fixed metres per second regardless. So the
  # SLOWEST member's patrol speed has to beat advance_speed_meters_per_second,
  # or that member falls behind its slot for the whole route and never arrives.
  # 2.0 m/s x 0.6 = 1.2 m/s here, against a cursor at 0.9.
  patrol:
    slot_radius_meters: 1.2
    input_magnitude: 0.6
    # About the vision cone's own reach, so it gives up at roughly the distance
    # it would have lost sight anyway. resume sits well inside it, or it yo-yos
    # on the boundary.
    leash_meters: 18.0
    leash_resume_meters: 6.0
