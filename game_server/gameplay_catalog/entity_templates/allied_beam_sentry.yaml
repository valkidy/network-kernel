# A sentry that fights for the player. Same chassis as beam_sentry; every
# difference is a side.
#
# Three things have to agree for a friendly agent to behave like one, and they
# are three separate mechanisms -- getting two right and one wrong produces a
# unit that is friendly in one system and hostile in another:
#
# 1. `camp: player_side` decides who it *looks* for. classify_agent_relation
#    (kernel.cc:264) reads camp, so this sentry sees enemy_side agents as
#    hostile and the player as an ally, and enemy agents see it as hostile.
#    Without a camp an agent defaults to enemy_side
#    (gameplay_config.cc:3341).
# 2. `collider_template: allied_sentry_hit_aabb` decides who can *hit it*. The
#    hit collider's layer becomes its gameplay_category, which is what every
#    weapon's collision_mask is matched against. camp has no part in that.
# 3. `allied_sentry_beam`'s `hostile_side` mask decides who *it* can hit.
#
# Nothing spawns this yet -- the game-rule director only spawns enemy waves. The
# quickest way to get one into a running world is to point
# test_bottle_spawn_enemy_prop's `template` parameter at it and throw the bottle;
# see docs/ACTION_GRAPH_TEST_BOTTLES.md.
id: 27
name: allied_beam_sentry
entity_type: actor
actor_type: agent
camp: player_side
collider_template: allied_sentry_hit_aabb
health:
  hp: 300
  max_hp: 300
movement:
  controller: grounded
  move_speed_meters_per_second: 2.5
  collider_template: sentry_grunt_movement_capsule
  gravity: {x: 0.0, y: -9.81, z: 0.0}
  max_slope_degrees: 50.0
  step_height: 0.4
  ground_probe_distance: 0.25
  ground_snap_distance: 0.5
hitbox:
  center: {x: 0.0, y: 0.8, z: 0.0}
  half_extents: {x: 0.4, y: 0.8, z: 0.4}
weapon_slots:
  - 9
active_weapon_slot: 0
animations:
  idle: 0
  chasing: 1
# Shared with the hostile sentries: a vision cone carries range and FOV, not a
# side. Which contacts inside it count as hostile is camp's job.
vision:
  collider_template: sentry_grunt_vision_cone
ai:
  controller: sentry
  profile: allied_beam_sentry
  sentry:
    # Half the hostile sentry's 90-tick windup. The 3 s telegraph on an enemy
    # exists to give the player time to break line of sight; on a unit fighting
    # for the player that delay is only a handicap.
    alert_ticks: 45
    forget_ticks: 150
    patrol_rotation_interval_ticks: 30
    patrol_rotation_min_degrees: 15.0
    patrol_rotation_max_degrees: 30.0
    weapon_id: 9
    animation_idle: idle
    animation_attack: chasing
