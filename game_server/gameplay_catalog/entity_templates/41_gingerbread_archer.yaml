id: 41
name: gingerbread_archer
entity_type: actor
actor_type: agent
camp: enemy_side
collider_template: sentry_grunt_hit_aabb
# Modelled on gingerbread_mage (31). Lighter still than the mage: it fights from
# a little further out and its volley is direct damage, so it pays for that in
# health.
health:
  hp: 600
  max_hp: 600
stagger:
  threshold: 150
  per_damage: 1.0
  decay_per_tick: 5.0
  decay_delay_ticks: 20
  duration_ticks: 15
  immunity_ticks: 45
# Same client landing clip as the mage: 21 ticks on the ground after a knockback.
knockdown:
  recovery_ticks: 21
movement:
  controller: character
  move_speed_meters_per_second: 2.0
  collider_template: sentry_grunt_movement_capsule
  gravity: {x: 0.0, y: -9.81, z: 0.0}
  max_slope_degrees: 50.0
  step_height: 0.4
  ground_probe_distance: 0.25
  ground_snap_distance: 0.5
  collision_mask: terrain | static_obstacle | actor
# Gingerbread Archer Arrow. Its arrow is a parabolic projectile, which is what
# turns the ballistic solver on (agent_sentry_config() reads the weapon's
# projectile template). Swapping this slot for a linear weapon silently turns
# the arc back into a straight line.
weapon_slots:
  - 24
active_weapon_slot: 0
animations:
  idle: 0
  chasing: 1
vision:
  collider_template: gingerbread_archer_vision_cone
# Same shape as the mage: close to a firing distance, then shoot from there.
# 18 < 22 <= 25 keeps the hold band inside the skill range, so everywhere the
# archer is parked, it shoots; and 22 m stays well inside the 34 m cone.
ai:
  default_behavior: guard
  profile: arrow_artillery
  perception:
    alert_ticks: 45
    forget_ticks: 150
    # Targets overhead or past the arrow's v^2/g reach (~69 m) have no low arc.
    ballistic_retry_cooldown_ticks: 30
    idle_rotation_interval_ticks: 30
    idle_rotation_degrees: {min: 15.0, max: 30.0}
    animation_idle: idle
    animation_attack: chasing
  locomotion:
    stop_distance_meters: 18.0
    resume_distance_meters: 22.0
    input_magnitude: 1.0
    # Backs away from a player inside 10 m, still shooting, out to 21 m -- inside
    # the hold band, short of the 25 m skill range. At 2.0 m/s even a player
    # standing on it is 21 m off in ~10.5 s, hence 11 s before it gives up.
    retreat:
      trigger_distance_meters: 10.0
      target_distance_meters: 21.0
      max_ticks: 330
      cooldown_ticks: 150
  # Only read when this archer is in a squad.
  behaviors:
    squad:
      slot_radius_meters: 1.2
      input_magnitude: 0.5
      leash_meters: 34.0
      leash_resume_meters: 10.0
  skills:
    - use: {type: weapon, value: 24}
      when: {range_meters: {max: 25.0}}
