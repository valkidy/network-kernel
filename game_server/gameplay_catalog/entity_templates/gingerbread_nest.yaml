# A nest: it stands in the world, it can be destroyed, and while it stands it
# puts gingerbread out around itself.
#
# The rule is on the nest rather than in the catalog's `patrols:` list, and that
# is the difference between the two kinds of world population here. A patrol is
# a global rule with no body: nothing can stop it. A nest's rule lives exactly
# as long as the nest, so destroying one stops it -- with no bookkeeping to say
# so -- and three nests are three instances of this template, each with its own
# cadence and its own ceiling.
#
# What it has already put out survives it. That is deliberate: despawning what a
# player has just fought their way through, at the moment they destroy the nest,
# is worse than any population it would save.
id: 208
name: gingerbread_nest
entity_type: prop
health:
  hp: 800
  max_hp: 800
physics:
  collider_template: gingerbread_nest_hitbox
triggers:
  # Collapsing on whoever brought it down. Free, in the sense that props have
  # carried this hook all along -- see activation_damage_prop.
  on_health_depleted:
    action_graph: action_apply_damage_at_health_depleted
    parameters:
      target: event.instigator
      amount: 40
spawner:
  # Every eight seconds at 30 Hz.
  interval_ticks: 240
  # Whole waves only: with room for fewer than count.min the nest waits rather
  # than putting out a short one, because a wave cannot be trimmed -- the
  # composition's minimums are assigned before anything is drawn.
  count: {min: 2, max: 4}
  # A comfortable multiple of the wave, or the headroom between the ceiling and
  # a whole wave is never usable.
  max_live_agents: 12
  radius: 5.0
  composition:
    - entity_template: gingerbread
      min: 2
      max: 4
  # Coming out of the door rather than appearing in the yard. A unit is created
  # at `start` -- inside the nest, where the nest's own collider is what a shot
  # hits first -- and is not the AI's until it reaches `exit`.
  entry:
    # 1.2 s at 30 Hz. Also the timeout: a door blocked by something the walk
    # cannot push aside releases the unit where it stands rather than stranding
    # it inside the nest for good.
    max_ticks: 36
    # A fifth of a second apart, so a wave comes out in single file instead of
    # as one clump in the doorway.
    stagger_ticks: 6
    # Terrain only, for the length of the walk. The nest has to stop blocking
    # them or they cannot leave at all, and so does each other: a queue waiting
    # its turn inside the nest would otherwise shove its own members out through
    # the walls, which is exactly what has been switched off.
    movement_collision_mask: terrain
    exits:
      # Straight out the front. 2.6 m clears the hitbox's 1 m half extent plus
      # the gingerbread's 0.4 m capsule with room to spare, which is what the
      # catalog checks: released still overlapping the nest, a unit would be
      # shoved sideways the moment its own mask came back.
      - start: {x: 0.0, y: 0.0, z: 0.0}
        exit: {x: 0.0, y: 0.0, z: 2.6}
