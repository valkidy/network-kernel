id: 23
name: biped_actor
entity_type: actor
actor_type: agent
camp: enemy_side
collider_template: sentry_grunt_hit_aabb
health:
  hp: 500
  max_hp: 500
movement:
  controller: character
  move_speed_meters_per_second: 2.5
  collider_template: monster_sim_movement_capsule
  gravity: {x: 0.0, y: -9.81, z: 0.0}
  max_slope_degrees: 50.0
  step_height: 0.4
  ground_probe_distance: 0.25
  ground_snap_distance: 0.5
  max_yaw_degrees_per_second: 45.0
  collision_mask: terrain
hitbox:
  center: {x: 0.0, y: 20.0, z: 0.0}
  half_extents: {x: 12.0, y: 22.0, z: 8.0}
weapon_slots: [2]
active_weapon_slot: 0
vision:
  collider_template: sentry_grunt_vision_cone
ai:
  controller: sentry
  profile: monster_sim
  sentry:
    alert_ticks: 90
    forget_ticks: 150
    patrol_rotation_interval_ticks: 30
    patrol_rotation_min_degrees: 15.0
    patrol_rotation_max_degrees: 30.0
    passive_patrol: true
    patrol_extent_x_meters: 30.0
    patrol_input_magnitude: 1.0
    weapon_id: 2
    animation_idle: idle
    animation_attack: chasing
animations:
  idle: 0
  chasing: 1
skeleton:
  runtime_asset: skeleton_assets/generated/simplified_biped.ozz
  source_manifest: skeleton_assets/generated/simplified_biped.skeleton_manifest.json
  # What this actor's rig colliders mean. The rig file says which bones carry
  # them and what shape they are; this says whose side they are on. The same rig
  # could be a friendly actor with a different layer here.
  collision_flags: {purpose: limb | hit, layer: hostile_side}
locomotion:
  type: procedural_legged
  input_deadzone: 0.01
  gait:
    type: displacement_threshold
    # Same 1.95/18 as the other rigs: the timing follows move_speed, not leg
    # length. See quadruped_actor.yaml.
    step_threshold_meters: 1.95
    step_duration_ticks: 18
    # Two legs, alternating: one group each, one swinging at a time. A biped is
    # statically unstable mid-swing by construction -- there is only one foot
    # down -- but nothing here models balance, so it walks regardless. The
    # arms are not driven; they are in the skeleton, not in this leg list.
    max_swinging_legs: 1
    processing_order: [leg0, leg1]
  foothold:
    query: raycast
    # 1.18x the authored 30/90 baseline, matching this rig's 21.5 m legs.
    # See docs/LOCOMOTION_GAIT_TUNING.md.
    query_start_height_meters: 36.0
    query_distance_meters: 108.0
    candidate_offsets_meters:
      - {x: 0.0, z: 0.0}
      - {x: 0.2, z: 0.0}
      - {x: -0.2, z: 0.0}
      - {x: 0.0, z: 0.2}
      - {x: 0.0, z: -0.2}
  body:
    follow_speed: 10.0
    slope_alignment: 0.0
    # 1.57 m, more than the other two rigs need: this one's legs hang almost
    # straight down (93.2% rest extension, 1.46 m slack) where the quadruped's
    # splay out to 88.9%. The crouch buys the same ~3 m dip budget.
    stance_crouch_meters: 1.57
  # One value for every leg on all three rigs, so it is a default rather than
  # something repeated per leg.
  leg_defaults:
    step_height_meters: 0.18
    max_reach_ratio: 0.99
  # Only the gait grouping differs per leg; the bones and bend geometry are in
  # the rig file.
  legs:
    - id: leg0
      gait_group: 0
    - id: leg1
      gait_group: 1
