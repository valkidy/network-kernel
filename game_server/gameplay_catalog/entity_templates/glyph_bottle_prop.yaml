# World half of fungible_glyph_bottle: the thrown bottle that breaks on the floor
# and leaves a glyph_block. The same shape as stateful_magic_bottle_prop, which
# does this for ice_block; the self-damage keeps it from re-firing while it rests.
id: 210
name: glyph_bottle_prop
entity_type: prop
health:
  hp: 1
  max_hp: 1
physics:
  collider_template: collision_damage_prop_hitbox
triggers:
  on_collision:
    collision_mask: terrain
    action_graph: action_spawn_ice_and_damage_self_at_collision
    parameters:
      template: glyph_block
      position: event.position
      direction: event.direction
      owner: self
      source: self
      self_damage: 1
