id: 1
name: player
entity_type: actor
actor_type: player
camp: player_side
collider_template: player_hit_aabb
health:
  hp: 1000
  max_hp: 1000
# Dead players stay in the world, hidden and inert, so their relevance still has
# an anchor and a revive has a body to bring back. It is the kernel's default for
# players anyway; authored so the template says so.
death_policy: dormant
# First-pass tuning. 30 Hz ticks. The grunt slam authors 120 of stagger, so it
# always staggers; claws and projectiles need several hits inside the decay
# window. Two seconds of immunity after each stagger keeps a crowd from
# chain-locking the player.
stagger:
  threshold: 120
  per_damage: 1.0
  decay_per_tick: 3.0
  decay_delay_ticks: 30
  duration_ticks: 12
  immunity_ticks: 60
movement:
  controller: character
  move_speed_meters_per_second: 5.0
  collider_template: player_movement_capsule
  gravity: {x: 0.0, y: -9.81, z: 0.0}
  max_slope_degrees: 50.0
  step_height: 0.4
  ground_probe_distance: 0.25
  ground_snap_distance: 0.5
  # The engine default (terrain | static_obstacle | actor) plus limb, so a
  # legged rig's own bones stop the player instead of letting them walk through
  # the legs of something whose body they cannot pass. Limbs are opt-in: this is
  # the only place that asks for them, and every other actor is unaffected.
  collision_mask: terrain | static_obstacle | actor | limb
hitbox:
  center: {x: 0.0, y: 0.9, z: 0.0}
  half_extents: {x: 0.35, y: 0.9, z: 0.35}
weapon_slots:
  - 3
  - 1
  - 7
  - 0
active_weapon_slot: 0
inventory_slot_capacity: 8
inventory_slots:
  # - item_template: fungible_potion
  #  quantity: 5
  # - item_template: stateful_potion
  #  quantity: 1
  - item_template: fungible_glyph_bottle
    quantity: 10
  - item_template: fungible_shockwave_bottle
    quantity: 3
  - item_template: fungible_frag_grenade_bottle
    quantity: 2
  - item_template: stateful_magic_bottle
    quantity: 1
  - item_template: stateful_magic_bottle
    quantity: 1
  - item_template: stateful_magic_bottle
    quantity: 1
  - item_template: stateful_magic_bottle
    quantity: 1
animations:
  idle: 0
  chasing: 1
