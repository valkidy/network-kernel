# A flying hive: an airship that drops gingerbread on whoever it spots.
#
# It hovers at 14 m on the hover controller and calls for help the way a
# courier does -- on_alert -- except that its help falls out of the sky.
# Calls are unbounded while it can see its target, one every 10 s, up to six
# of its own alive at once; each wave comes out 3 m under the hull and drops
# to the ground on the gingerbread's own gravity. It is armed too, with the
# drone's beam, so it is not harmless once the drop is on the ground.
#
# Built to be used as a one-ship patrol (a patrol definition with count 1,
# which takes one place in the patrol budget). What it drops is not part of
# that squad and does not count against it.
id: 37
name: hive_airship
entity_type: actor
actor_type: agent
camp: enemy_side
collider_template: hive_airship_hit_aabb
health:
  hp: 3000
  max_hp: 3000
# Nothing pushes an airship around.
impulse_resistance: 1000.0
movement:
  controller: hover
  move_speed_meters_per_second: 1.5
  collider_template: hive_airship_movement_capsule
  gravity: {x: 0.0, y: 0.0, z: 0.0}
  max_slope_degrees: 50.0
  step_height: 0.4
  ground_probe_distance: 0.25
  ground_snap_distance: 0.5
  collision_mask: terrain | static_obstacle
  hover:
    height_meters: 14.0
    vertical_speed_meters_per_second: 2.0
hitbox:
  center: {x: 0.0, y: 1.5, z: 0.0}
  half_extents: {x: 3.0, y: 1.5, z: 3.0}
weapon_slots:
  - 16
active_weapon_slot: 0
animations:
  idle: 0
  chasing: 1
vision:
  collider_template: drone_vision_cone
ai:
  controller: chaser
  profile: default
  sentry:
    alert_ticks: 60
    forget_ticks: 300
    patrol_rotation_interval_ticks: 60
    patrol_rotation_min_degrees: 10.0
    patrol_rotation_max_degrees: 20.0
    animation_idle: idle
    animation_attack: chasing
  chaser:
    # Drifts to within 4 m of being overhead and stays there, so its drops
    # land around the target. The beam reaches 20 m: from 14 m up that is
    # about 14 m across, so 10 is comfortably inside it.
    stop_distance_meters: 4.0
    resume_distance_meters: 6.0
    input_magnitude: 1.0
    attack_range_meters: 10.0
  patrol:
    slot_radius_meters: 2.0
    input_magnitude: 0.6
    leash_meters: 30.0
    leash_resume_meters: 10.0
spawner:
  trigger: on_alert
  # Unbounded while it sees its target; the gap and its own ceiling are what
  # hold it back, and the reinforce budget above them.
  calls_per_alert: 0
  interval_ticks: 300
  max_live_agents: 6
  radius: 3.0
  # Under the hull. A gingerbread is 1.6 m tall, so 3 m down clears the
  # underside the hover holds height from, and the hull's capsule with it.
  offset: {x: 0.0, y: -3.0, z: 0.0}
  count: {min: 2, max: 3}
  composition:
    # A character-controller unit, so it falls. A grounded or kinematic one
    # would be seated on the floor the tick it was created.
    - entity_template: gingerbread
      min: 2
      max: 3
