# Mission flow: which objectives exist, in what order, and what has to
# happen before the next one opens. The graph is acyclic by construction --
# gameplay_config.cc rejects a cycle at load -- which is right for a mission
# and wrong for anything periodic. Roaming population belongs to
# world_rule instead.
id: 101
name: game_rule
entity_type: director
server_only: true
transform:
  position: {x: 0.0, y: 0.0, z: 0.0}
ai:
  controller: director
  profile: game_rule
  tick_interval: 1
director:
  kind: game_rule
  graph:
    nodes:
      - id: wait_for_player
        condition:
          type: player_count_at_least
          count: 1
        next:
          - clear_the_nests
          - giant_open_combat
          - giant_forest_flank
          - giant_swamp_shortcut
          - giant_narrow_pass
      # The objective is the nests themselves. Placing them here and waiting on
      # the same group being eliminated is the whole mission: three things in
      # the world, each putting gingerbread out until it is destroyed.
      #
      # Nothing special connects the two halves. The mission rule spawns props
      # and waits for them to die, which it could already do; each prop carries
      # its own spawner, which needs nothing from the mission rule. A nest is a
      # group member and a spawner at once because those are separate concerns
      # that happen to meet on one entity.
      - id: clear_the_nests
        on_activate:
          - type: spawn_group
            group: nests
            count: 3
            entity_template: gingerbread_nest
            position: {x: 0.0, y: 0.0, z: 0.0}
            radius: 30.0
            seed: 4242
        condition:
          type: group_eliminated
          group: nests
      # One giant in each of the 4-zone map's zones, each its own objective,
      # all opened by the same player arrival as the nests. A giant's
      # passive_patrol walks +/-30 m along world x from where it spawns, in a
      # straight line with no navmesh, so every spawn point sits on a 60 m
      # east-west strip with no wall or trunk across it (checked against the
      # source OBJ, y is the floor plus 0.5 m):
      #   open combat     x -80..-20 at z 60     flat
      #   forest flank    x 14..74   at z 78     the north forest path, >= 6.8 m
      #                                          from the nearest trunk
      #   swamp shortcut  x 20..80   at z -50    swamp bed, -1.8 to -1.1 m
      #   narrow pass     x -85..-25 at z -50.2  the pass's east-west leg, a
      #                                          ~6.5 m floor between walls; its
      #                                          north-south corridor runs along
      #                                          z, which an x-only patrol cannot
      #                                          walk
      # Each stays well clear of the nests' 30 m ring: its GEO_ boxes span 16 m
      # across, and it should not land on top of one.
      - id: giant_open_combat
        on_activate:
          - type: spawn_group
            group: giant_open_combat
            count: 1
            entity_template: gingerbread_giant
            position: {x: -50.0, y: 0.5, z: 60.0}
        condition:
          type: group_eliminated
          group: giant_open_combat
      - id: giant_forest_flank
        on_activate:
          - type: spawn_group
            group: giant_forest_flank
            count: 1
            entity_template: gingerbread_giant
            position: {x: 44.0, y: 0.7, z: 78.0}
        condition:
          type: group_eliminated
          group: giant_forest_flank
      - id: giant_swamp_shortcut
        on_activate:
          - type: spawn_group
            group: giant_swamp_shortcut
            count: 1
            entity_template: gingerbread_giant
            position: {x: 50.0, y: -1.1, z: -50.0}
        condition:
          type: group_eliminated
          group: giant_swamp_shortcut
      - id: giant_narrow_pass
        on_activate:
          - type: spawn_group
            group: giant_narrow_pass
            count: 1
            entity_template: gingerbread_giant
            position: {x: -55.0, y: 0.8, z: -50.2}
        condition:
          type: group_eliminated
          group: giant_narrow_pass
