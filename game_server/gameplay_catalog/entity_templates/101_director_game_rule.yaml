# Mission flow: which objectives exist, in what order, and what has to
# happen before the next one opens. The graph is acyclic by construction --
# gameplay_config.cc rejects a cycle at load -- which is right for a mission
# and wrong for anything periodic. Roaming population belongs to
# world_rule instead.
id: 101
name: game_rule
entity_type: director
server_only: true
transform:
  position: {x: 0.0, y: 0.0, z: 0.0}
ai:
  controller: director
  profile: game_rule
  tick_interval: 1
director:
  kind: game_rule
  graph:
    nodes:
      - id: wait_for_player
        condition:
          type: player_count_at_least
          count: 1
        next:
          - clear_the_nests
          - giant_open_combat
          - giant_forest_flank
          - giant_swamp_shortcut
          - giant_narrow_pass
          - lone_mage
          - lone_drone
      # The objective is the nests themselves. Placing them here and waiting on
      # the same group being eliminated is the whole mission: three things in
      # the world, each putting gingerbread out until it is destroyed.
      #
      # Nothing special connects the two halves. The mission rule spawns props
      # and waits for them to die, which it could already do; each prop carries
      # its own spawner, which needs nothing from the mission rule. A nest is a
      # group member and a spawner at once because those are separate concerns
      # that happen to meet on one entity.
      - id: clear_the_nests
        on_activate:
          - type: spawn_group
            group: nests
            count: 3
            entity_template: gingerbread_nest
            position: {x: 0.0, y: 0.0, z: 0.0}
            radius: 30.0
            seed: 4242
        condition:
          type: group_eliminated
          group: nests
      # One giant in each of the 4-zone map's zones, each its own objective,
      # all opened by the same player arrival as the nests. A giant is a
      # patrol that walks its behavior.route and fights what it sees. Three
      # of them walk +/-30 m along world x from where they spawn -- what the
      # old passive_patrol sweep did -- so every such spawn point sits on a
      # 60 m east-west strip with no prop within 7 m of it and no step over
      # 0.25 m per metre along it (checked against plane_200x200_4zones_v2.obj;
      # y is the floor plus 0.5 m):
      #   open combat     x -80..-20 at z -56    flat, ~35 m clear of the camp
      #   forest flank    x -63..-3  at z 83     the only clear strip in the
      #                                          forest, along its north edge
      #   swamp shortcut  x 20..80   at z 86     its north edge, floor ~0.4 m
      #   narrow pass     a controller.route instead: see that node
      # Each stays well clear of the nests' 30 m ring: its GEO_ boxes span 16 m
      # across, and it should not land on top of one.
      - id: giant_open_combat
        on_activate:
          - type: spawn_group
            group: giant_open_combat
            count: 1
            entity_template: gingerbread_giant
            position: {x: -50.0, y: 0.45, z: -56.0}
            behavior:
              route:
                - {x: -80.0, y: 0.0, z: -56.0}
                - {x: -20.0, y: 0.0, z: -56.0}
        condition:
          type: group_eliminated
          group: giant_open_combat
      # A mage and a drone on their own, in open combat ~30 m from the player
      # spawn: the only places either appears otherwise are squads, and squad
      # members never back off (docs/AI_RANGED_RETREAT_PLAN.md Q4), so these two
      # are where a ranged agent's retreat can be seen. Spawned like this they
      # are guards. Both spots were checked against the navmesh: the mage's is
      # flat (0.2-0.5 m within 10 m) and walkable 20 m in every direction, 19 m
      # south of the open-combat giant's lane; the drone hovers ~15 m from it.
      - id: lone_mage
        on_activate:
          - type: spawn_group
            group: lone_mage
            count: 1
            entity_template: gingerbread_mage
            position: {x: -55.0, y: 0.8, z: -75.0}
        condition:
          type: group_eliminated
          group: lone_mage
      - id: lone_drone
        on_activate:
          - type: spawn_group
            group: lone_drone
            count: 1
            entity_template: beam_drone
            position: {x: -62.0, y: 1.5, z: -88.0}
        condition:
          type: group_eliminated
          group: lone_drone
      - id: giant_forest_flank
        on_activate:
          - type: spawn_group
            group: giant_forest_flank
            count: 1
            entity_template: gingerbread_giant
            position: {x: -33.0, y: 0.6, z: 83.0}
            behavior:
              route:
                - {x: -63.0, y: 0.0, z: 83.0}
                - {x: -3.0, y: 0.0, z: 83.0}
        condition:
          type: group_eliminated
          group: giant_forest_flank
      - id: giant_swamp_shortcut
        on_activate:
          - type: spawn_group
            group: giant_swamp_shortcut
            count: 1
            entity_template: gingerbread_giant
            position: {x: 50.0, y: 0.95, z: 86.0}
            behavior:
              route:
                - {x: 20.0, y: 0.0, z: 86.0}
                - {x: 80.0, y: 0.0, z: 86.0}
        condition:
          type: group_eliminated
          group: giant_swamp_shortcut
      - id: giant_narrow_pass
        on_activate:
          - type: spawn_group
            group: giant_narrow_pass
            count: 1
            entity_template: gingerbread_giant
            position: {x: 48.5, y: 0.95, z: -55.0}
            # Through the pass rather than across it: in from the open ground
            # to its north and down the whole north-south valley between the
            # ridge to the west and the plateau's cliff to the east. Walked end
            # to end and back. The floor is 9 m wide at its narrowest (z -50)
            # and up to 20 m at its ends; each leg is pathed over the navmesh,
            # but the navmesh is baked for a 0.6 m agent, so these points --
            # the floor's centre line, measured off the OBJ -- are what keep a
            # 5.6 m stance off the cliff. The giant joins at the corner nearest
            # its spawn point.
            behavior:
              route:
                - {x: 50.0, y: 0.0, z: 10.0}
                - {x: 51.0, y: 0.0, z: -10.0}
                - {x: 50.5, y: 0.0, z: -20.0}
                - {x: 49.5, y: 0.0, z: -30.0}
                - {x: 49.0, y: 0.0, z: -40.0}
                - {x: 48.5, y: 0.0, z: -50.0}
                - {x: 49.0, y: 0.0, z: -60.0}
                - {x: 49.5, y: 0.0, z: -70.0}
                - {x: 50.0, y: 0.0, z: -85.0}
        condition:
          type: group_eliminated
          group: giant_narrow_pass
