# tripod_actor with the gingerbread's chaser AI instead of a passive-patrol
# sentry. A separate template rather than an edit, because
# agent_sentry_per_agent_config_test depends on tripod_actor patrolling.
id: 211
name: tripod_chaser
entity_type: actor
actor_type: agent
camp: enemy_side
collider_template: sentry_grunt_hit_aabb
health:
  hp: 10000
  max_hp: 10000
movement:
  controller: character
  move_speed_meters_per_second: 2.5
  collider_template: monster_sim_movement_capsule
  gravity: {x: 0.0, y: -9.81, z: 0.0}
  max_slope_degrees: 50.0
  step_height: 0.4
  ground_probe_distance: 0.25
  ground_snap_distance: 0.5
  max_yaw_degrees_per_second: 45.0
  # static_obstacle so a chase is blocked by props and nests instead of walking
  # through them. No actor: it would shove the rest of its squad around.
  collision_mask: terrain | static_obstacle
hitbox:
  center: {x: 0.0, y: 12.0, z: 0.0}
  half_extents: {x: 10.0, y: 14.0, z: 10.0}
weapon_slots: [2]
active_weapon_slot: 0
vision:
  collider_template: tripod_vision_cone
ai:
  controller: chaser
  profile: default
  # passive_patrol and its extent/magnitude are gone: the catalog rejects a
  # chaser that sets them.
  sentry:
    alert_ticks: 90
    forget_ticks: 150
    patrol_rotation_interval_ticks: 30
    patrol_rotation_min_degrees: 15.0
    patrol_rotation_max_degrees: 30.0
    weapon_id: 2
    animation_idle: idle
    # The moving clip, not the attack -- see gingerbread.yaml.
    animation_attack: chasing
  chaser:
    # Scaled to the body, not copied from the gingerbread's 1.8/2.1: the
    # hitbox is 10 m in half extent, so a metre-scale stop would park it on
    # top of its target.
    stop_distance_meters: 14.0
    resume_distance_meters: 18.0
    input_magnitude: 1.0
    # Weapon 2 is the projectile spammer, a ranged weapon, so no gate: it
    # fires whenever it sees something.
    attack_range_meters: 0.0
  # Only read when in a squad. 2.5 m/s x 0.6 = 1.5 m/s beats the warband's
  # 0.9 m/s cursor.
  patrol:
    slot_radius_meters: 3.0
    input_magnitude: 0.6
    # Past the 50 m vision cone, so it gives up about when it would have lost
    # sight anyway; resume well inside it so it does not yo-yo.
    leash_meters: 60.0
    leash_resume_meters: 20.0
animations:
  idle: 0
  chasing: 1
skeleton:
  runtime_asset: skeleton_assets/generated/simplified_tripod.ozz
  source_manifest: skeleton_assets/generated/simplified_tripod.skeleton_manifest.json
  # What this actor's rig colliders mean. The rig file says which bones carry
  # them and what shape they are; this says whose side they are on. The same rig
  # could be a friendly actor with a different layer here.
  collision_flags: {purpose: limb | hit, layer: hostile_side}
locomotion:
  type: procedural_legged
  input_deadzone: 0.01
  gait:
    type: displacement_threshold
    # Same 1.95/18 as the other rigs: the timing follows move_speed, not leg
    # length. See quadruped_actor.yaml.
    step_threshold_meters: 1.95
    step_duration_ticks: 18
    # An odd leg count has no diagonal to pair, so each leg is its own gait
    # group and exactly one swings at a time -- a three-phase wave gait, which
    # is the statically stable choice for a tripod because the two planted feet
    # plus the body's own footprint always straddle the centre of mass.
    #
    # This needs no engine support beyond what the quadruped already uses:
    # gait_group is an arbitrary index validated against leg_count, and the
    # scheduler's rule is "at most one group swinging", not "two alternating
    # groups". processing_order is what fixes the phase sequence.
    max_swinging_legs: 1
    processing_order: [leg0, leg1, leg2]
  foothold:
    query: raycast
    # 1.29x the authored 30/90 baseline, matching this rig's 23.5 m legs.
    # See docs/LOCOMOTION_GAIT_TUNING.md.
    query_start_height_meters: 39.0
    query_distance_meters: 117.0
    candidate_offsets_meters:
      - {x: 0.0, z: 0.0}
      - {x: 0.2, z: 0.0}
      - {x: -0.2, z: 0.0}
      - {x: 0.0, z: 0.2}
      - {x: 0.0, z: -0.2}
  body:
    follow_speed: 10.0
    slope_alignment: 0.0
    # Same 88.9% rest extension as the quadruped -- identical limbs, only the
    # hip placement differs -- so the same small crouch reaches ~3 m of slack.
    stance_crouch_meters: 0.40
  # One value for every leg on all three rigs, so it is a default rather than
  # something repeated per leg.
  leg_defaults:
    step_height_meters: 0.18
    max_reach_ratio: 0.99
  # Only the gait grouping differs per leg; the bones and bend geometry are in
  # the rig file.
  legs:
    # Leg0 leads, with leg1 and leg2 trailing at +/-120 degrees.
    - id: leg0
      gait_group: 0
    - id: leg1
      gait_group: 1
    - id: leg2
      gait_group: 2
