# The initial camp (design D1-D5): where a player picks the loadout every
# respawn gives them. Unlimited -- each item pick is one of the options below,
# fills one inventory slot, and may be repeated, up to the player's
# inventory_slot_capacity; weapons are picked at most one per category.
#
# A building like the tent and the field camp: activating it takes the
# player inside, the loadout UI (ui 2) is open while inside, and activating it
# again comes back out. The offer is sent on the way in, and a pick is taken
# only from inside.
#
# No health and no lifecycle, so nothing removes it: with no population group
# it is never evicted either, which is the highest importance a building can
# have (importance only orders eviction within a group). For now the game rule
# puts it in the scene at the start; a scene file will later.
id: 219
name: initial_camp
entity_type: prop
impulse_resistance: 1000.0
physics:
  collider_template: tent_hitbox
# Several players may be picking at once; hidden from enemies like a tent's.
shelter:
  capacity: 8
  hide_occupants_from_vision: true
interaction:
  capabilities: [interactable]
  range: 3.0
  line_of_sight_required: false
triggers:
  on_activated:
    action_graph: action_open_loadout_ui
    parameters:
      target: event.instigator
loadout:
  options:
    - item_template: fungible_potion
      quantity: 3
    - item_template: fungible_mp_potion
      quantity: 2
    - item_template: fungible_shockwave_bottle
      quantity: 3
    - item_template: fungible_frag_grenade_bottle
      quantity: 2
    - item_template: fungible_tornado_bottle
      quantity: 3
    - item_template: fungible_pull_bottle
      quantity: 3
    - item_template: fungible_water_balloon
      quantity: 3
    - item_template: fungible_tent_kit
      quantity: 1
    - item_template: fungible_camp_kit
      quantity: 1
  weapons:
    - stateful_weapon_rifle
    - stateful_weapon_shotgun
    - stateful_weapon_meteor_staff
    - stateful_weapon_rocket
    - stateful_weapon_sky_laser
    - stateful_weapon_beam_rifle
    - stateful_weapon_meteor_storm_staff
    - stateful_weapon_water_bubble_staff
