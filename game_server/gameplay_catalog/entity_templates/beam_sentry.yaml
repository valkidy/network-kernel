# Beam-armed sentry. Same chassis as sentry_grunt; the difference is weapon 8,
# a sustained beam, in place of the linear-projectile spammer.
#
# See grenade_sentry.yaml for the ballistic (parabolic) variant. Nothing here
# solves a firing arc: beam_sentry_beam is a linear projectile, so
# agent_runtime_manager.cc:48 leaves ballistic_aim disabled and the executor
# aims straight from the launch position at the target.
id: 25
name: beam_sentry
entity_type: actor
actor_type: agent
camp: enemy_side
collider_template: sentry_grunt_hit_aabb
health:
  hp: 500
  max_hp: 500
movement:
  controller: grounded
  move_speed_meters_per_second: 2.5
  collider_template: sentry_grunt_movement_capsule
  gravity: {x: 0.0, y: -9.81, z: 0.0}
  max_slope_degrees: 50.0
  step_height: 0.4
  ground_probe_distance: 0.25
  ground_snap_distance: 0.5
hitbox:
  center: {x: 0.0, y: 0.8, z: 0.0}
  half_extents: {x: 0.4, y: 0.8, z: 0.4}
weapon_slots:
  - 8
active_weapon_slot: 0
animations:
  idle: 0
  chasing: 1
# 12 m, and the beam reaches 14 -- the beam must out-range the cone, not the
# other way round. See beam_sentry_beam_box.yaml.
vision:
  collider_template: sentry_grunt_vision_cone
ai:
  controller: sentry
  profile: beam_sentry
  sentry:
    # 3 s of tracking before the first shot, against sentry_grunt's 3 s as well:
    # a beam that starts the moment the cone clips a player is far harder to
    # read than a projectile stream.
    alert_ticks: 90
    forget_ticks: 150
    patrol_rotation_interval_ticks: 30
    patrol_rotation_min_degrees: 15.0
    patrol_rotation_max_degrees: 30.0
    weapon_id: 8
    animation_idle: idle
    animation_attack: chasing
