# World half of fungible_shockwave_bottle: breaks on whatever it hits and
# leaves a shockwave_blast. The same shape as test_bottle_blast_prop; the
# self-damage keeps it from detonating again on every tick it rests.
id: 212
name: shockwave_bottle_prop
entity_type: prop
health:
  hp: 1
  max_hp: 1
physics:
  collider_template: collision_damage_prop_hitbox
triggers:
  on_collision:
    collision_mask: terrain | static_obstacle | actor
    action_graph: action_spawn_projectile_and_damage_self_at_collision
    parameters:
      template: shockwave_blast
      position: event.position
      direction: event.direction
      source: self
      self_damage: 1
