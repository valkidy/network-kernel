catalog_version: 16
prop_population_rules:
  - id: 1
    name: temporary_deployable
    max_alive: 256
  # Tents only. Kept apart from temporary_deployable so a pile of ice blocks
  # can never evict a tent someone is resting in.
  - id: 2
    name: tent
    max_alive: 4
    # A tent folding away throws its occupants clear however it goes, so its
    # on_destroy_entity runs on expiry and eviction too.
    cleanup_runs_on_destroy: true
action_template_dir: action_templates
action_graph_template_dir: action_graph_templates
status_effect_template_dir: status_effect_templates
reload_action_template:
  id: 4199
  name: shared_reload
  trigger_mode: press
  flags: [cancel_on_death, cancel_on_weapon_change, cancel_before_first_commit]
  ammo_cost_per_commit: 0
  commit_offset_ticks: 30
  commit_interval_ticks: 0
  max_commit_count: 1
  recovery_ticks: 0
  hold_input_timeout_ticks: 0
weapon_template_dir: weapon_templates
projectile_template_dir: projectile_templates
entity_template_dir: entity_templates
preload_directors:
  - game_rule
item_template_dir: item_templates
collider_template_dir: collider_templates
skeleton_manifests_dir: skeleton_assets/generated
# The baked navmesh for the scene below, which has been shipping in this bundle
# since mesh_asset_bakes started emitting one -- nothing had ever loaded it.
# game_server loads it itself and the kernel never sees it: navigation is what
# the AI decides with, and kernel movement is driven by the character controller.
#
# It has to name the same source mesh as static_collision_scene, or squads will
# path over one shape and walk into another.
navigation_mesh:
  entry_path: mesh_assets/recast/plane_200x200.navmesh
static_collision_scene:
  # entry_path: mesh_assets/jolt/undulating.joltmesh
  entry_path: mesh_assets/jolt/plane_200x200.joltmesh
  scene_id: 1
  collider_id: 2147483649
  collision_layer: 1
# Props placed once the server is running, before any mission: a stand-in for
# the scene file that will place a map's fixed props. The initial camp sits
# beside the spawn point, so the first thing a player can do is pick a loadout.
scene_props:
  - entity_template: initial_camp
    position: {x: 6.0, y: 0.0, z: 0.0}
# `scene_items:` (none by default) lays items on the map from the start, each
#   - item_template: <name>   quantity: <n, default 1>   position: {x, y, z}
# A weapon placed so is a map weapon: a loadout being reapplied leaves it with
# whoever picked it up. Every entity placed here moves the net ids of all that
# follow, which some order-sensitive tests notice (knockdown_recovery_test).
player:
  entity_template: player
  # A dead player comes back delay_seconds later, height_offset metres above
  # its body (less under a ceiling) so it drops back in, and cannot be hurt for
  # invulnerable_seconds. team_revive_times is one pool shared by every player:
  # -1 never runs out; at 0 the dead stay dead.
  respawn:
    delay_seconds: 4.0
    height_offset: 50.0
    invulnerable_seconds: 2.0
    team_revive_times: -1
# Squads the world produces on its own schedule, independent of the mission.
# Authored here rather than on world_rule because a patrol never
# reaches the kernel as a director: game_server spawns it, owns its grouping and
# walks its route, the same way it owns every other AI decision.
#
# The route is a straight chord between two points in the area, which is exactly
# a pathed route on this map -- plane_200x200 is flat -- and wrong the day the
# map is not. See //game_server:patrol_nav_bench.
#
# A ceiling across every definition, which is the one thing the per-definition
# ceilings below cannot express.
patrol_budget:
  max_live_agents: 48
# Every unit an on_alert spawner has put out, server-wide, alive at once. Each
# caller's own max_live_agents bounds one caller; this bounds all of them, so N
# callers spotting a player on the same tick cannot put out N waves. It counts
# the units, not the callers: killing a caller does not hand its share back.
reinforce_budget:
  max_live_agents: 64
# Every agent on the server. Patrols, nests and calls for help only fill room
# that is left under it, and calls give way first. Mission and world rules, and
# action-graph spawns, are counted but never refused -- so this must stay above
# whatever they keep in the world, or nothing discretionary ever spawns.
#
# Sized from this map's discretionary ceilings: patrols 48 + calls 64 + nests
# (12 each) + mission/world rules is about 170, and 256 leaves half again. At
# -c opt that is ~2 ms of kernel tick (200 engaged agents measured 1.6 ms),
# well inside 33 ms. 200 fighting agents near one party is the most the
# snapshot path has been measured clean at, so 256 converging on one party is
# past what has been measured; drop to 200 if that shows.
agent_budget:
  max_live_agents: 256
patrols:
  - id: 1
    name: gingerbread_warband
    area:
      shape: rect
      center: {x: 0.0, y: 0.0, z: 0.0}
      half_extents: {x: 40.0, y: 0.0, z: 40.0}
    seed: 7717
    # Every 30 s at 30 Hz, and two squads at a time; a finished squad retires
    # and gives its place back.
    interval_ticks: 900
    max_live_groups: 2
    count: {min: 10, max: 16}
    # Floors plus capacity, not a second opinion about the total. Every entry
    # gets its minimum -- 1 warrior and 6 gingerbread, 7 of the 20 -- and the
    # remainder is handed out one at a time, each unit going to an entry in
    # proportion to the room it has left. The floors have to fit inside the
    # smallest squad (7 <= 20) and the ceilings have to fill the largest
    # (5 + 24 = 29 >= 24), or the catalog refuses to load.
    #
    # The whole 1-5 band is reachable rather than pinned at its ceiling: four
    # spare warrior slots against eighteen spare gingerbread ones, dealt into a
    # remainder of 13 to 17, puts warriors at five about 20% of the time and
    # spreads the rest across 1 to 4. Widening the gingerbread band, or raising
    # the total, pushes that number down; narrowing it pushes it up.
    composition:
      - entity_template: gingerbread_warrior
        min: 1
        max: 5
      - entity_template: gingerbread_mage
        min: 1
        max: 3
      - entity_template: gingerbread_mushroom
        min: 6
        max: 20
    # Three abreast, so 24 members stand eight ranks deep -- about 10 m of
    # column behind the squad's point. The rank width is not authored; it is
    # kRankWidth in formation_offsets.
    formation_spacing_meters: 1.5
    # Below the slowest member's patrol speed. gingerbread walks at 1.26 m/s
    # and the warrior at 1.20; a cursor faster than either would leave that
    # member behind its slot for the whole route.
    advance_speed_meters_per_second: 0.9
    waypoint_radius_meters: 0.5
    # Ten seconds standing at the end of the route before the squad goes, so it
    # does not vanish in front of whoever walked it down.
    despawn_linger_ticks: 300
    # And gone early if nobody is within 120 m, which on a 200 m map means a
    # squad on the far side of it. Never while it is fighting.
    despawn_distance_meters: 120.0
    # Four times the straight line before a start/end pair is thrown back. On
    # this flat map every route is the straight line, so nothing is ever
    # rejected; the number is here for the map that is not flat.
    max_detour_ratio: 4.0
    route_attempts: 8
  - id: 2
    name: gingerbread_airforce
    area:
      shape: rect
      center: {x: 0.0, y: 0.0, z: 0.0}
      half_extents: {x: 40.0, y: 0.0, z: 40.0}
    seed: 7717
    # Every 30 s at 30 Hz, and two squads at a time; a finished squad retires
    # and gives its place back.
    interval_ticks: 900
    max_live_groups: 1
    count: {min: 4, max: 8}
    # Floors plus capacity, not a second opinion about the total. Every entry
    # gets its minimum -- 1 warrior and 6 gingerbread, 7 of the 20 -- and the
    # remainder is handed out one at a time, each unit going to an entry in
    # proportion to the room it has left. The floors have to fit inside the
    # smallest squad (7 <= 20) and the ceilings have to fill the largest
    # (5 + 24 = 29 >= 24), or the catalog refuses to load.
    #
    # The whole 1-5 band is reachable rather than pinned at its ceiling: four
    # spare warrior slots against eighteen spare gingerbread ones, dealt into a
    # remainder of 13 to 17, puts warriors at five about 20% of the time and
    # spreads the rest across 1 to 4. Widening the gingerbread band, or raising
    # the total, pushes that number down; narrowing it pushes it up.
    composition:
      - entity_template: hive_airship
        min: 1
        max: 2
      - entity_template: beam_drone
        min: 2
        max: 6
    # Three abreast, so 24 members stand eight ranks deep -- about 10 m of
    # column behind the squad's point. The rank width is not authored; it is
    # kRankWidth in formation_offsets.
    formation_spacing_meters: 1.5
    # Below the slowest member's patrol speed. gingerbread walks at 1.26 m/s
    # and the warrior at 1.20; a cursor faster than either would leave that
    # member behind its slot for the whole route.
    advance_speed_meters_per_second: 0.9
    waypoint_radius_meters: 0.5
    # Ten seconds standing at the end of the route before the squad goes, so it
    # does not vanish in front of whoever walked it down.
    despawn_linger_ticks: 300
    # And gone early if nobody is within 120 m, which on a 200 m map means a
    # squad on the far side of it. Never while it is fighting.
    despawn_distance_meters: 120.0
    # Four times the straight line before a start/end pair is thrown back. On
    # this flat map every route is the straight line, so nothing is ever
    # rejected; the number is here for the map that is not flat.
    max_detour_ratio: 4.0
    route_attempts: 8