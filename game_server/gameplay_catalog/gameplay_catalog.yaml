# 19: scene_template_dir (docs/SCENE_TABLE_PLAYABLE_LOOP_PLAN.md).
# 20: start_scene; map_variant / map_variants removed (docs/START_SCENE_PLAN.md).
# 21: scene_props rotation / grounded, player_barriers, map_edge_barrier
#     (docs/LEVEL_AUTHORING_TOOLS_PLAN.md).
catalog_version: 21
prop_population_rules:
  - id: 1
    name: temporary_deployable
    max_alive: 256
  # Buildings: tents and field camps share these places. Kept apart from
  # temporary_deployable so a pile of ice blocks can never evict a tent
  # someone is resting in; a new building may.
  - id: 2
    name: building
    max_alive: 4
    # A tent folding away throws its occupants clear however it goes, so its
    # on_destroy_entity runs on expiry and eviction too. A building with no
    # on_destroy_entity has nothing to run.
    cleanup_runs_on_destroy: true
  # Portals, apart from buildings: two at a time, a third evicting the oldest
  # (and its exit with it).
  - id: 3
    name: portal
    max_alive: 2
action_template_dir: action_templates
action_graph_template_dir: action_graph_templates
status_effect_template_dir: status_effect_templates
sp_attack_template_dir: sp_attack_templates
reload_action_template:
  id: 4199
  name: shared_reload
  trigger_mode: press
  flags: [cancel_on_death, cancel_on_weapon_change, cancel_before_first_commit]
  ammo_cost_per_commit: 0
  commit_offset_ticks: 30
  commit_interval_ticks: 0
  max_commit_count: 1
  recovery_ticks: 0
  hold_input_timeout_ticks: 0
weapon_template_dir: weapon_templates
projectile_template_dir: projectile_templates
entity_template_dir: entity_templates
preload_directors:
  - game_rule
item_template_dir: item_templates
collider_template_dir: collider_templates
patrol_template_dir: patrol_templates
skeleton_manifests_dir: skeleton_assets/generated
# The map is a scene template (docs/START_SCENE_PLAN.md): start_scene names
# the one slot 0 plays, and 0 -- scene_templates/0_scene_initial_camp.yaml,
# the initial camp every session starts in -- is the default. Everything tied
# to one map's coordinates or to how it is made lives in its template, laid
# over the rest of this file when it loads (a mapping merges key by key, so a
# template's `player: {spawn_position}` keeps the player's other keys below).
# The bundle carries this file once per template that can start a session,
# gameplay_catalog.scene_<id>.yaml with start_scene set to it: a dedicated
# server starts on another map without a rebuild, and pure clients follow the
# entry the server names. A random terrain (seed -1) cannot start one; it is
# opened from the camp.
#
# The composed mesh templates (0, 2, 3, 5) and the kernel terrain one (6) are
# the same map. The mesh is the Unity prototype's seed-1 compose of it,
# exported as an OBJ and baked like any hand-made map (mesh_assets/raw, x and
# z 0..216); the kernel terrain is the kernel composing the same recipe
# itself, centred on the origin (x and z -108..108). So a position on the
# mesh is the kernel terrain one plus 108 on x and z. The mesh is sampled
# every ~1.5 m, so its ground can sit up to ~0.4 m off the kernel's (more on
# a cliff).
start_scene: 0
# Levels (docs/SCENE_TABLE_PLAYABLE_LOOP_PLAN.md): one file per level,
# <id>_scene_<name>.yaml, each an overlay with a map's keys plus its id, name,
# level: info (only a level has it, which is what the terminal lists) and its
# own game_rule:. Laid over this file's root. Positions are the level's own, as if it sat at
# the origin; the server adds the slot's offset. The id is what goes on the
# wire. A terrain level with a fixed seed has its recipe cooked into the
# bundle at terrain.recipe (gameplay_catalog_bundle/BUILD.bazel).
scene_template_dir: scene_templates
# The ids and layer the map's collision registers under, whichever template
# supplies its shape (a mesh names entry_path; a terrain is its own shape).
static_collision_scene:
  scene_id: 1
  collider_id: 2147483649
  collision_layer: 1
# `scene_items:` (none by default) lays items on the map from the start, each
#   - item_template: <name>   quantity: <n, default 1>   position: {x, y, z}
# A weapon placed so is a map weapon: a loadout being reapplied leaves it with
# whoever picked it up. Every entity placed here moves the net ids of all that
# follow, which some order-sensitive tests notice (knockdown_recovery_test).
player:
  entity_template: player
  # Where a joining player is put (spawn_position) comes from the map
  # variant above: beside the initial camp, so the first thing a player can
  # do is pick a loadout.
  # The kill floor, in metres. Any actor or prop that falls below it has left
  # the map: a living actor dies (a player respawns at spawn_position), and
  # anything else is removed. Must be under spawn_position.
  fall_death_height: -10.0
  # A dead player comes back delay_seconds later, height_offset metres above
  # its body (less under a ceiling) so it drops back in, and cannot be hurt for
  # invulnerable_seconds. team_revive_times is one pool shared by every player:
  # -1 never runs out; at 0 the dead stay dead.
  respawn:
    delay_seconds: 4.0
    height_offset: 50.0
    invulnerable_seconds: 2.0
    team_revive_times: -1
# Squads the world produces on its own schedule, independent of the mission.
# Authored in the catalog rather than on world_rule because a patrol never
# reaches the kernel as a director: game_server spawns it, owns its grouping and
# walks its route, the same way it owns every other AI decision. Each definition
# is a file under patrol_template_dir; `patrols:` below picks which ones run.
#
# The route is pathed over navigation_mesh when one is loaded, and a straight
# chord between two points in the area otherwise -- wrong on this map, which is
# not flat: it would walk squads into cliffs and trunks. East of
# plane_200x200_4zones_v2's 04_Narrow_Pass valley (x > 62, z < 0) is a plateau
# ~11 m up, ringed by cliffs no agent can climb, so a point drawn on it finds no
# route from the low ground. The valley floor below it is connected;
# pass_giant_route_test walks it. See //game_server:patrol_nav_bench.
#
# A ceiling across every definition, which is the one thing the per-definition
# ceilings cannot express.
# Player orders to their side's agents (docs/AI_BEHAVIOR_PLAN.md §12.9).
agent_commands:
  # After an order is obeyed, the player's next one waits this long: 5 s.
  # Agents take orders slowly on purpose, so each order is a considered one.
  peer_cooldown_ticks: 150
# Routes an agent command may send a player-side patrol along, by id
# (docs/AI_BEHAVIOR_PLAN.md B15): a client names one of these and never sends
# waypoints of its own. World space, so they are per map: see the scene templates.
# Six squads of up to twelve: four players at 1.5 squads each, rounded up
# (docs/PLAYER_TARGETED_PATROL_PLAN.md §9).
patrol_budget:
  max_live_agents: 72
# Every unit an on_alert spawner has put out, server-wide, alive at once. Each
# caller's own max_live_agents bounds one caller; this bounds all of them, so N
# callers spotting a player on the same tick cannot put out N waves. It counts
# the units, not the callers: killing a caller does not hand its share back.
reinforce_budget:
  max_live_agents: 64
# Every agent on the server. Patrols, nests and calls for help only fill room
# that is left under it, and calls give way first. Mission and world rules, and
# action-graph spawns, are counted but never refused -- so this must stay above
# whatever they keep in the world, or nothing discretionary ever spawns.
#
# Sized from this map's discretionary ceilings: patrols 48 + calls 64 + nests
# (12 each) + mission/world rules is about 170, and 256 leaves half again. At
# -c opt that is ~2 ms of kernel tick (200 engaged agents measured 1.6 ms),
# well inside 33 ms. 200 fighting agents near one party is the most the
# snapshot path has been measured clean at, so 256 converging on one party is
# past what has been measured; drop to 200 if that shows.
agent_budget:
  max_live_agents: 256
# Which of the patrol_template_dir definitions run. Every file there is loaded
# and validated whether it is listed or not, so a broken definition fails the
# catalog even while it is switched off; only the listed ids ever spawn.
#
# 1 the warband, 3 the giant; 2 (the airforce) is off.
patrols:
  - ids: [1, 3] # [1, 2, 3]
