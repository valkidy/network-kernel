id: 5
name: gingerbread_royal_guard
# The caped gingerbread king walking past the players with an escort, aimed at
# them the way the giant is (docs/PLAYER_TARGETED_PATROL_PLAN.md): it starts
# 50-60 m out, past the kernel's 44 m relevance exit, and walks a route that
# passes within 25 m of where they stood -- inside the king's 35 m vision.
where:
  mode: around_players
  ring: {min_meters: 50.0, max_meters: 60.0}
  pass_within_meters: 25.0
  exit_spread_degrees: 30.0
  group_radius_meters: 18.0
  # One royal guard per group of players, one per two players across the
  # server, rounded up -- the giant's rate.
  groups_per_member: 1.0
  groups_per_player: 0.5
  # Two minutes with none near a group puts it first in line.
  floor_interval_ticks: 3600
# Its own seed: two definitions sharing one draw the same size, composition
# and route for every squad. 7717 (1, 2), 7719 (3) and 7723 (4) are taken.
seed: 7729
# Every 60 s at 30 Hz. A finished squad retires and gives its place back.
interval_ticks: 1800
# Members take formation slots in this order -- slot 0 front left, slot 1
# front centre, slot 2 front right, then ranks of three behind (kRankWidth in
# formation_offsets) -- so one warrior first puts the king, second, at the
# front centre, flanked by the warrior and the first archer, with the rest of
# the archers and the gingerbread in the ranks behind it.
#
# Floors plus capacity: the floors (1 + 1 + 2 + 3 = 7) fit the smallest squad
# and the ceilings (1 + 1 + 4 + 6 = 12) fill the largest, or the catalog
# refuses to load.
count: {min: 7, max: 12}
composition:
  - {entity_template: gingerbread_warrior, min: 1, max: 1}
  - {entity_template: gingerbread_king_cape, min: 1, max: 1}
  - {entity_template: gingerbread_archer, min: 2, max: 4}
  - {entity_template: gingerbread, min: 3, max: 6}
# One spacing for every slot, set by the king: its body spans 6.9 m either
# side of its origin and its cape hangs ~7 m behind, so at 8 m the flankers
# stand clear of its legs and the first rank behind clear of its cape. The
# escort is spread wide for it -- 12 members are a 16 m by 24 m block.
formation_spacing_meters: 8.0
# Below the slowest member's patrol speed: the archer at 2.0 x 0.5 = 1.0 m/s
# (warrior 2.2 x 0.6, king 2.5). A cursor faster than that would leave the
# archers behind their slots for the whole route.
advance_speed_meters_per_second: 0.9
# The king's feet are metres apart; a tight radius would have it shuffling on
# each waypoint, as on the giant's patrol.
waypoint_radius_meters: 2.0
despawn_linger_ticks: 300
despawn_distance_meters: 120.0
# The navmesh is baked for a 0.6 m agent, so a route can run where the king's
# ~9 m stance does not fit (a narrow terrace or a stamp's rim). Watch it on the
# terrain map before trusting it near cliffs.
max_detour_ratio: 4.0
route_attempts: 8
