# The reach of the tornado. An area effect's radius is its collider's radius
# (kernel.cc derives area_radius from the template), so how wide the funnel
# pulls from is authored here. How tall it reaches is the projectile's
# half_height: the overlap is an upright column (area_shape: cylinder), not
# this sphere.
id: 35
name: tornado_column
shape: sphere
center: {x: 0.0, y: 0.0, z: 0.0}
half_extents: {x: 3.0, y: 3.0, z: 3.0}
radius: 3.0
purpose: damage
layer: area_effect
