id: 4130
name: charge_horns_swing
# Every weapon needs a fire action, but the charge's contact never goes through
# one: the kernel tests the cone on every tick of the run
# (Kernel_ServerEnqueueEntityCharge), and the chaser never selects this weapon
# to swing it. A copy of grunt_slam_swing so the weapon is still a working one
# if something does select it.
trigger_mode: press
flags: [cancel_on_death, cancel_on_weapon_change, cancel_before_first_commit]
ammo_cost_per_commit: 1
commit_offset_ticks: 8
commit_interval_ticks: 45
max_commit_count: 1
recovery_ticks: 12
hold_input_timeout_ticks: 0
