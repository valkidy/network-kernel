# Rig identity and colliders for simplified_gingerbread_giant.glb.
# GEO_* box dimensions are stored in the GLB node scales.
# Gait timing and other locomotion tuning belong to the entity template.
#
# The GLB holds Unity left-handed values like the other rigs: it was converted
# from the mixamo-derived (right-handed glTF) export with
# tools/gltf_to_unity_handedness.py, so leg0 (mixamo Left) sits at -X and a
# skinned mesh imported by glTFast follows the kernel pose without conversion.
# The same run re-authored the rest pose, which the export had nearly straight
# with a 7 degree SIDEWAYS knee bend: each knee is bent 30 degrees forward
# about its local -X and each hip rotated -13.75 degrees to keep the foot under
# it. The exact --rotate arguments are recorded in the GLB's asset.extras.
rig_version: 2
skeleton: simplified_gingerbread_giant
forward_axis: positive_z
root_bone: SIM_Root
body_bone: JNT_Body
# Knee-local, and its SIGN matters even though the validator ignores it: a
# positive rotation about mid_axis opens the knee, so the axis must oppose the
# bind bend normal cross(knee - hip, foot - knee). A leg whose hinge points the
# other way still validates, but the IK then folds it backwards and the pole
# spins the whole leg 180 degrees about its length -- the foot faces backwards.
# The export's shared (0, 0, -1) did exactly that to leg0. Both knees share
# their local frame, so one axis serves both: alignment 0.97 on each leg.
knee_hinge_local: {x: 1.0, y: 0.0, z: 0.0}
# Model-space unit poles: the bind knee's offset from the hip-foot line, i.e.
# forward with a slight outward lean.
legs:
  - {id: leg0, hip: JNT_Leg0_Hip, knee: JNT_Leg0_Knee, foot: JNT_Leg0_Foot,
     pole_local: {x: -0.240200, y: 0.041291, z: 0.969845}}
  - {id: leg1, hip: JNT_Leg1_Hip, knee: JNT_Leg1_Knee, foot: JNT_Leg1_Foot,
     pole_local: {x: 0.235283, y: 0.038167, z: 0.971177}}
colliders:
  - {bone: GEO_Leg0_Upper, leg: leg0}
  - {bone: GEO_Leg0_Lower, leg: leg0}
  - {bone: GEO_Leg1_Upper, leg: leg1}
  - {bone: GEO_Leg1_Lower, leg: leg1}
  # The arms name no leg: they are limbs of the rig, but not part of any gait.
  - {bone: GEO_Arm0_Upper}
  - {bone: GEO_Arm0_Lower}
  - {bone: GEO_Arm1_Upper}
  - {bone: GEO_Arm1_Lower}
  - {bone: GEO_Hip}
  - {bone: GEO_Torso}
  - {bone: GEO_Body}
  - {bone: GEO_Head}
