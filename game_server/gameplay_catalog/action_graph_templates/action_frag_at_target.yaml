id: action_frag_at_target
parameters:
  target: null
  amount: 200
actions:
  # Damage only. No apply_impulse, and stagger: 0 so the hit adds nothing to
  # the target's stagger meter -- the frag must not do the shockwave's job.
  - type: apply_damage
    target: params.target
    amount: params.amount
    stagger: 0
