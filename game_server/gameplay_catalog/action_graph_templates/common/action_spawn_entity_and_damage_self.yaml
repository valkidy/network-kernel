# Spawns `template` where a thrown prop landed, owned by `owner`, then damages
# the prop itself (`source`) so it breaks. `placement` is exact (at the
# contact point: an ice block) or clear (moved to open ground: a building a
# kit puts up). `lifetime_ticks` replaces the spawned template's own lifetime;
# zero keeps it. A summon gives one (docs/SUMMON_FOLLOW_PLAN.md E3): a
# player-side actor spawned for a prop that is nobody's belongs to whoever
# threw the prop (E1), and goes, when its time is up, the way an enemy killed
# does.
id: action_spawn_entity_and_damage_self
parameters:
  template: null
  position: null
  direction: null
  owner: null
  source: null
  self_damage: 1
  placement: exact
  lifetime_ticks: 0
actions:
  - type: spawn_entity
    entity_template: params.template
    position: params.position
    direction: params.direction
    owner: params.owner
    placement: params.placement
    lifetime_ticks: params.lifetime_ticks
  - type: apply_damage
    target: params.source
    amount: params.self_damage
