id: 3
name: rocket_projectile
damage: 45
sync_mode: server_snapshot_only
collider_template: rocket_aabb
movement_model: linear
hit_response: destroy
damage_shape: direct_hit
speed: 35.0
lifetime_ticks: 75
# limb makes a legged rig's bones a target, so a rocket aimed at a monster
# strikes the leg in its path instead of sailing between them into the body.
# The hit resolves to the actor wearing the leg, so damage and side filtering
# are unchanged.
collision_mask: damageable | limb | terrain | static_obstacle
max_hit_count: 1
gravity:
  x: 0.0
  y: 0.0
  z: 0.0
triggers:
  on_projectile_impact:
    action_graph: action_spawn_projectile_at_impact
    parameters:
      template: rocket_explosion
      position: event.position
      direction: event.direction
