id: 11
name: shotgun_tracer
# Presentation only, and the same arrangement as rifle_tracer: shotgun is an
# instant weapon, so the server resolves every pellet by raycast and creates no
# projectile entity. See rifle_tracer.yaml for why the reference exists at all.
#
# One template covers the whole spread. A shot draws pellet_count tracers from
# it, one per direction -- pellet_directions() in weapon_system.cc is pure index
# arithmetic with no RNG, so a client reproduces the server's fan exactly from
# pellet_count and pellet_spread alone.
type: standard
collider_template: shotgun_segment
movement_model: linear
sync_mode: local_predicted_deterministic
hit_response: destroy
damage_shape: none
damage: 0
collision_mask: none
# Shorter reach than the rifle's tracer because the weapon's max_range is 40,
# not 100; lifetime_ticks again matches the 3 ticks the server keeps its own
# hitscan segment alive.
speed: 200.0
lifetime_ticks: 3
max_hit_count: 1
gravity:
  x: 0.0
  y: 0.0
  z: 0.0
